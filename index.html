<button type="button" onClick="{{borrarDibujo}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #FECACA; background: #FFFFFF; color: #B91C1C; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Borrar</button>
</div>
</div>
<div style="border: 1.5px solid #CBD5E1; border-radius: 14px; overflow: hidden">
<canvas data-lienzo="dibujo" data-keep="dibujo" width="900" height="520" aria-label="Área para dibujar con el dedo, lápiz o mouse"></canvas>
</div>
<span style="font-size: 13px; color: #475569">Dibuja con el dedo, un lápiz o el mouse. El dibujo se guarda con la sesión y se puede enviar al paciente.</span>
</section>

<section aria-labelledby="t-s5" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<h2 id="t-s5" style="margin: 0; font-size: 18px; font-weight: 800">Evidencias fotográficas</h2>
<label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #EFF6FF; color: #1D4ED8; font-weight: 800; font-size: 14px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Tomar o agregar fotos
<input type="file" accept="image/*" multiple onChange="{{agregarFotos}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px">
<template data-sc="for" list="{{fotos}}" as="f" hint-placeholder-count="0">
<div style="position: relative; border-radius: 14px; overflow: hidden; background: #F1F5F9; aspect-ratio: 1 / 1">
<a href="{{f.url}}" target="_blank" rel="noopener" style="display: block; width: 100%; height: 100%"><img src="{{f.url}}" alt="Evidencia {{f.n}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></a>
<button type="button" onClick="{{f.quitar}}" aria-label="Quitar foto {{f.n}}" style="position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 99px; border: 0; background: rgba(15, 42, 74, 0.75); color: #FFFFFF; font-size: 18px; cursor: pointer">×</button>
</div>
</template>
</div>
<template data-sc="if" value="{{sinFotos}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: #475569">Aún no hay fotos. En el celular o la tableta puedes tomarlas directamente con la cámara.</span></template>
</section>

<section aria-labelledby="t-s6" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="t-s6" style="margin: 0; font-size: 18px; font-weight: 800">Enviar al paciente</h2>
<p style="margin: 0; font-size: 14px; color: #475569">{{ayudaEnvio}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px; cursor: pointer"><input type="checkbox" checked="{{inclDibujo}}" onChange="{{toggleDibujo}}" style="width: 20px; height: 20px; accent-color: #1D4ED8">Incluir el dibujo</label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px; cursor: pointer"><input type="checkbox" checked="{{inclFotos}}" onChange="{{toggleFotos}}" style="width: 20px; height: 20px; accent-color: #1D4ED8">Incluir las fotos</label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px">
<button type="button" onClick="{{enviarWa}}" disabled="{{noGuardada}}" style="min-height: 50px; border-radius: 999px; border: 0; background: #15803D; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Enviar por WhatsApp</button>
<button type="button" onClick="{{enviarCorreo}}" disabled="{{noGuardada}}" style="min-height: 50px; border-radius: 999px; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Enviar por correo</button>
<button type="button" onClick="{{descargarDibujo}}" disabled="{{sinDibujo}}" style="min-height: 50px; border-radius: 999px; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Descargar dibujo</button>
</div>
</section>

<div class="barra-acciones">
<span style="font-size: 14px; font-weight: 700; color: {{estadoColor}}" role="status">{{estado}}</span>
<span class="espacio"></span>
<button type="button" onClick="{{guardar}}" disabled="{{ocupado}}" style="min-height: 54px; padding: 0 32px; border-radius: 999px; border: 0; background: #1E3A8A; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer; box-shadow: 0 6px 16px rgba(30, 58, 138, 0.25)">{{textoGuardar}}</button>
</div>
</main>
</div>
</script>
<script type="text/x-component" id="js-Sesion">
var COLORES = [
  { nombre: 'azul oscuro', hex: '#0F2A4A' }, { nombre: 'azul', hex: '#2563EB' },
  { nombre: 'rosado', hex: '#DB2777' }, { nombre: 'verde', hex: '#059669' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.vacio();
  }
  vacio() {
    return {
      cargando: true, ocupado: false, estado: '', error: false, toast: '',
      pacientes: [], servicios: [], plantillas: [], consentimientos: [],
      sesionId: null, cita: null, pacienteId: null, pacQuery: '', pacFijo: false,
      fecha: APP.f.hoy(), servicio: '', resumen: '', notas: '', ejercicios: '',
      fotos: [], dibujoRuta: null, guardada: false,
      color: '#0F2A4A', grosor: 4, inclDibujo: true, inclFotos: true
    };
  }
  lienzo() { return APP.lienzo('dibujo'); }
  aviso(t, error) {
    var self = this; this.setState({ estado: t, error: !!error }); clearTimeout(this._t);
    if (!error) this._t = setTimeout(function () { self.setState({ estado: '' }); }, 3500);
  }
  alMostrar(params) {
    var self = this;
    params = params || {};
    if (params.reanudar && (this.state.pacienteId || this.state.pacQuery)) {
      APP.db.listar('consentimientos').then(function (c) { self.setState({ consentimientos: c }); }).catch(function () {});
      return;
    }
    this.setState(this.vacio());
    setTimeout(function () {
      var lz = self.lienzo();
      if (lz) { lz.reiniciar(); lz.color = '#0F2A4A'; lz.grosor = 4; lz.alCambiar = function () { self.setState({ guardada: false }); }; }
    }, 0);
    Promise.all([
      APP.db.listar('pacientes', { order: ['nombre'] }),
      APP.db.servicios(),
      APP.db.ajuste('plantillas_ejercicios').catch(function () { return null; }),
      APP.db.listar('consentimientos').catch(function () { return []; })
    ]).then(function (r) {
      self.setState({ pacientes: r[0], servicios: r[1], plantillas: r[2] || [], consentimientos: r[3] });
      if (params.s) return self.cargarSesion(params.s);
      if (params.c) return self.cargarCita(params.c);
      if (params.p) self.fijarPaciente(params.p);
      self.setState({ cargando: false });
    }).catch(function (e) { self.aviso(APP.mensajeError(e), true); });
  }
  fijarPaciente(id, fijo) {
    var p = this.state.pacientes.find(function (x) { return x.id === id; });
    if (p) this.setState({ pacienteId: p.id, pacQuery: p.nombre, pacFijo: !!fijo });
  }
  cargarCita(id) {
    var self = this;
    return APP.db.listar('citas', { eq: [['id', id]] }).then(function (cs) {
      var c = cs[0];
      if (!c) { self.aviso('No se encontró la cita.', true); return; }
      return APP.db.listar('sesiones', { eq: [['cita_id', id]] }).then(function (ss) {
        if (ss[0]) return self.cargarSesion(ss[0].id);
        self.setState({ cita: c, fecha: c.fecha, servicio: c.servicio && c.servicio !== 'Valoración' ? c.servicio : '', cargando: false });
        if (c.paciente_id) self.fijarPaciente(c.paciente_id, true);
        else self.setState({ pacQuery: c.paciente_nombre });
      });
    });
  }
  cargarSesion(id) {
    var self = this;
    return APP.db.listar('sesiones', { eq: [['id', id]] }).then(function (ss) {
      var x = ss[0];
      if (!x) { self.aviso('No se encontró la sesión.', true); return; }
      self.setState({ sesionId: x.id, fecha: x.fecha, servicio: x.servicio || '', resumen: x.resumen || '', notas: x.notas || '',
        ejercicios: x.ejercicios || '', dibujoRuta: x.dibujo || null, guardada: true, cargando: false,
        cita: x.cita_id ? { id: x.cita_id } : null });
      self.fijarPaciente(x.paciente_id, true);
      var rutas = Array.isArray(x.fotos) ? x.fotos : [];
      Promise.all(rutas.map(function (r) { return APP.db.url(r).then(function (u) { return { ruta: r, url: u }; }).catch(function () { return { ruta: r, url: '' }; }); }))
        .then(function (fs) { self.setState({ fotos: fs }); });
      if (x.dibujo) {
        APP.db.url(x.dibujo).then(function (u) { var lz = self.lienzo(); if (lz) lz.cargar(u); }).catch(function () {});
      }
    });
  }
  agregarFotos(e) {
    var self = this, files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    this.aviso('Preparando fotos…');
    Promise.all(files.map(function (f) { return APP.u.redimensionar(f, 1600, 0.8); })).then(function (blobs) {
      var nuevas = blobs.map(function (b) { return { blob: b, url: URL.createObjectURL(b) }; });
      self.setState({ fotos: self.state.fotos.concat(nuevas), guardada: false });
      self.aviso(nuevas.length === 1 ? 'Foto agregada. Recuerda guardar.' : nuevas.length + ' fotos agregadas. Recuerda guardar.');
    }).catch(function (err) { self.aviso(err.message, true); });
  }
  guardar() {
    var self = this, s = this.state, lz = this.lienzo();
    if (!s.pacienteId && !s.pacQuery.trim()) { this.aviso('Elige o escribe el paciente.', true); return; }
    if (!s.servicio) { this.aviso('Selecciona al menos una terapia aplicada.', true); return; }
    if (s.pacienteId && this._faltantes && this._faltantes.length && !window.confirm('Faltan autorizaciones firmadas: ' + this._faltantes.join(', ') + '.\n\n¿Guardar la sesión de todas formas?')) return;
    this.setState({ ocupado: true }); this.aviso('Guardando…');
    var pacienteId;
    var paso = s.pacienteId ? Promise.resolve({ id: s.pacienteId }) : APP.db.pacientePorNombre(s.pacQuery);
    paso.then(function (p) {
      pacienteId = p.id;
      if (!lz || lz.vacio) return null;
      if (!lz.modificado && s.dibujoRuta) return s.dibujoRuta;
      return lz.blob().then(function (b) { return APP.db.subir(b, 'png'); });
    }).then(function (rutaDibujo) {
      return Promise.all(s.fotos.map(function (f) {
        return f.ruta ? Promise.resolve(f) : APP.db.subir(f.blob, 'jpg').then(function (r) { return { ruta: r, url: f.url }; });
      })).then(function (fotos) { return [rutaDibujo, fotos]; });
    }).then(function (r) {
      var fila = { paciente_id: pacienteId, fecha: s.fecha || APP.f.hoy(), servicio: s.servicio, resumen: s.resumen.trim() || null,
        notas: s.notas.trim() || null, ejercicios: s.ejercicios.trim() || null, dibujo: r[0], fotos: r[1].map(function (f) { return f.ruta; }) };
      if (s.cita && !s.sesionId) fila.cita_id = s.cita.id;
      var op = s.sesionId ? APP.db.actualizar('sesiones', s.sesionId, fila) : APP.db.crear('sesiones', fila);
      return op.then(function (ses) {
        var fin = s.cita && s.cita.estado && s.cita.estado !== 'realizada'
          ? APP.db.actualizar('citas', s.cita.id, { estado: 'realizada', paciente_id: pacienteId }) : Promise.resolve();
        return fin.then(function () { return [ses, r]; });
      });
    }).then(function (x) {
      if (lz) lz.modificado = false;
      self.setState({ ocupado: false, guardada: true, sesionId: x[0].id, pacienteId: pacienteId, pacFijo: true,
        dibujoRuta: x[1][0], fotos: x[1][1] });
      self.aviso('Sesión guardada. Ya puedes enviarla al paciente.');
    }).catch(function (e) { self.setState({ ocupado: false }); self.aviso('No se pudo guardar: ' + APP.mensajeError(e), true); });
  }
  paciente() {
    var id = this.state.pacienteId;
    return this.state.pacientes.find(function (p) { return p.id === id; }) || { nombre: this.state.pacQuery };
  }
  mensaje() {
    var s = this.state, F = APP.f, p = this.paciente();
    var t = 'Hola ' + (p.nombre || '').split(' ')[0] + ', te comparto el resumen de tu sesión de fisioterapia del ' + F.larga(s.fecha) + '.\n\n'
      + (s.servicio.indexOf(', ') >= 0 ? 'Terapias aplicadas: ' : 'Terapia aplicada: ') + s.servicio + '\n';
    if (s.resumen.trim()) t += '\nLo que realizamos:\n' + s.resumen.trim() + '\n';
    if (s.ejercicios.trim()) t += '\nEjercicios para casa:\n' + s.ejercicios.trim() + '\n';
    return t + '\nSi sientes alguna molestia o tienes dudas, escríbeme.\n\n' + APP.u.contacto;
  }
  archivos() {
    var s = this.state, lz = this.lienzo(), lista = [];
    if (s.inclDibujo && lz && !lz.vacio) lista.push(lz.blob().then(function (b) { return new File([b], 'ejercicio.png', { type: 'image/png' }); }));
    if (s.inclFotos) s.fotos.forEach(function (f, i) { if (f.url) lista.push(APP.u.aArchivo(f.url, 'foto-' + (i + 1) + '.jpg')); });
    return Promise.all(lista);
  }
  enlaces() {
    // Enlaces privados de 7 días a las imágenes elegidas (para WhatsApp por enlace y correo).
    var s = this.state, rutas = [];
    if (s.inclDibujo && s.dibujoRuta) rutas.push(['Dibujo del ejercicio', s.dibujoRuta]);
    if (s.inclFotos) s.fotos.forEach(function (f, i) { if (f.ruta) rutas.push(['Foto ' + (i + 1), f.ruta]); });
    if (!rutas.length || APP.db.demo) return Promise.resolve('');
    return Promise.all(rutas.map(function (r) { return APP.db.url(r[1], 7 * 24 * 3600).then(function (u) { return r[0] + ': ' + u; }); }))
      .then(function (l) { return '\n\nImágenes de tu sesión (disponibles por 7 días):\n' + l.join('\n'); });
  }
  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    var self = this, s = this.state, lz = this.lienzo();
    var q = s.pacQuery.trim().toLowerCase();
    var sugP = (!s.pacFijo && !s.pacienteId && q) ? s.pacientes.filter(function (p) {
      return p.nombre.toLowerCase().indexOf(q) !== -1 || String(p.cc || '').indexOf(q) !== -1;
    }).slice(0, 6).map(function (p) {
      return { nombre: p.nombre, info: p.cc ? 'CC ' + p.cc : 'Paciente registrado',
        pick: function () { self.setState({ pacienteId: p.id, pacQuery: p.nombre }); } };
    }) : [];
    var p = this.paciente();
    var firmados = s.consentimientos.filter(function (c) { return c.paciente_id === s.pacienteId; })
      .reduce(function (acc, c) { return acc.concat(c.servicios || []); }, []);
    var tiene = function (re) { return firmados.some(function (x) { return re.test(x); }); };
    var lista = s.servicio ? s.servicio.split(', ') : [];
    var fechaDe = function (re) {
      var c = s.consentimientos.filter(function (c) { return c.paciente_id === s.pacienteId && (c.servicios || []).some(function (x) { return re.test(x); }); })[0];
      return c ? new Date(c.firmado_en || Date.now()).toLocaleDateString('es-CO') : null;
    };
    var req = [];
    if (lista.some(function (x) { return /sueroterapia/i.test(x); }))
      req.push({ nombre: 'Sueroterapia', detalle: 'Intravenosa o nebulizada, según el procedimiento', fecha: fechaDe(/sueroterapia/i), botones: [['iv', 'Firmar intravenosa'], ['neb', 'Firmar nebulizada']] });
    var agujas = lista.filter(function (x) { return /punci|electropunci|neural/i.test(x); });
    var otras = lista.filter(function (x) { return !/sueroterapia|punci|electropunci|neural|^valoraci/i.test(x); });
    if (agujas.length) req.push({ nombre: 'Fisioterapia con técnicas con agujas', detalle: 'Por ' + agujas.join(', ').toLowerCase() + ': el paciente debe marcar la casilla de agujas', fecha: fechaDe(/agujas/i), botones: [['fisio', 'Firmar ahora']] });
    else if (otras.length) req.push({ nombre: 'Fisioterapia', detalle: 'Por ' + otras.join(', ').toLowerCase(), fecha: fechaDe(/^fisioterapia/i), botones: [['fisio', 'Firmar ahora']] });
    this._faltantes = req.filter(function (r) { return !r.fecha; }).map(function (r) { return r.nombre; });
    var puede = APP.u.puedeCompartirArchivos();
    var set = function (k) { return function (e) { var o = { guardada: false }; o[k] = e.target.value; self.setState(o); }; };
    return {
      pidActual: s.pacienteId || '',
      hayRequisitos: req.length > 0,
      sinPacienteReq: req.length > 0 && !s.pacienteId,
      conPacienteReq: req.length > 0 && !!s.pacienteId,
      requisitos: req.map(function (r) {
        return { nombre: r.nombre, detalle: r.detalle, ok: !!r.fecha, falta: !r.fecha, estado: r.fecha ? '✓ Firmado el ' + r.fecha : 'Pendiente de firma',
          bg: r.fecha ? '#ECFDF5' : '#FFF7ED', borde: r.fecha ? '#A7F3D0' : '#FED7AA', fg: r.fecha ? '#065F46' : '#9A3412',
          botones: r.botones.map(function (b) {
            return { texto: b[1], ir: function () { location.hash = '#Consentimiento?p=' + s.pacienteId + '&t=' + b[0] + '&volver=sesion' + (b[0] === 'fisio' && agujas.length ? '&agujas=1' : ''); } };
          }) };
      }),
      titulo: s.sesionId ? 'Sesión del ' + APP.f.corta(s.fecha) : 'Registrar sesión',
      subtitulo: s.cargando ? 'Cargando…' : (p.nombre ? p.nombre : 'Elige el paciente para empezar') + (s.cita && s.cita.hora != null ? ' · cita de las ' + APP.f.hora(s.cita.hora) : ''),
      pacQuery: s.pacQuery, pacFijo: s.pacFijo,
      setPac: function (e) { self.setState({ pacQuery: e.target.value, pacienteId: null, guardada: false }); },
      sugP: sugP, haySugP: sugP.length > 0,
      fecha: s.fecha, setFecha: set('fecha'),
      servicio: s.servicio, setServicio: set('servicio'), serviciosOpts: s.servicios,
      terapias: s.servicios.map(function (o) {
        var on = lista.indexOf(o.nombre) >= 0;
        return { nombre: o.nombre, marca: on ? '✓ ' : '', on: on ? 'true' : 'false', bg: on ? '#EFF6FF' : '#FFFFFF', borde: on ? '#1D4ED8' : '#CBD5E1', fg: on ? '#1E3A8A' : '#334155',
          pick: function () {
            var l = self.state.servicio ? self.state.servicio.split(', ') : [], i = l.indexOf(o.nombre);
            if (i >= 0) l.splice(i, 1); else l.push(o.nombre);
            self.setState({ servicio: l.join(', '), guardada: false });
          } };
      }),
      resumen: s.resumen, setResumen: set('resumen'),
      notas: s.notas, setNotas: set('notas'),
      ejercicios: s.ejercicios, setEjercicios: set('ejercicios'),
      plantillas: s.plantillas.map(function (t, i) {
        return { nombre: t.nombre,
          usar: function () { var e = self.state.ejercicios.trim(); self.setState({ ejercicios: (e ? e + '\n' : '') + t.texto, guardada: false }); },
          quitar: function () {
            if (!window.confirm('¿Eliminar la plantilla "' + t.nombre + '"?')) return;
            var l = self.state.plantillas.filter(function (_, j) { return j !== i; });
            self.setState({ plantillas: l });
            APP.db.guardarAjuste('plantillas_ejercicios', l).catch(function (e) { self.aviso(APP.mensajeError(e), true); });
          } };
      }),
      hayPlantillas: s.plantillas.length > 0,
      guardarPlantilla: function () {
        var texto = self.state.ejercicios.trim();
        if (!texto) { self.aviso('Escribe primero los ejercicios que quieres guardar.', true); return; }
        var nombre = window.prompt('Nombre corto para la plantilla (ej.: Lumbar básico):');
        if (!nombre || !nombre.trim()) return;
        var l = self.state.plantillas.concat([{ nombre: nombre.trim(), texto: texto }]);
        self.setState({ plantillas: l });
        APP.db.guardarAjuste('plantillas_ejercicios', l).then(function () { self.aviso('Plantilla guardada.'); })
          .catch(function (e) { self.aviso(APP.mensajeError(e), true); });
      },
      colores: COLORES.map(function (c) {
        var on = s.color === c.hex;
        return { nombre: c.nombre, hex: c.hex, on: on ? 'true' : 'false', borde: on ? '#F59E0B' : '#FFFFFF',
          pick: function () { var lz2 = self.lienzo(); if (lz2) lz2.color = c.hex; self.setState({ color: c.hex }); } };
      }),
      finoOn: s.grosor === 4 ? 'true' : 'false', gruesoOn: s.grosor === 10 ? 'true' : 'false',
      finoBorde: s.grosor === 4 ? '#1D4ED8' : '#CBD5E1', gruesoBorde: s.grosor === 10 ? '#1D4ED8' : '#CBD5E1',
      grosorFino: function () { var lz2 = self.lienzo(); if (lz2) lz2.grosor = 4; self.setState({ grosor: 4 }); },
      grosorGrueso: function () { var lz2 = self.lienzo(); if (lz2) lz2.grosor = 10; self.setState({ grosor: 10 }); },
      deshacer: function () { var lz2 = self.lienzo(); if (lz2) { lz2.deshacer(); self.setState({ guardada: false }); } },
      borrarDibujo: function () { var lz2 = self.lienzo(); if (lz2 && !lz2.vacio && window.confirm('¿Borrar todo el dibujo?')) { lz2.limpiar(); self.setState({ guardada: false }); } },
      fotos: s.fotos.map(function (f, i) {
        return { url: f.url, n: i + 1, quitar: function () {
          if (!window.confirm('¿Quitar esta foto de la sesión?')) return;
          self.setState({ fotos: self.state.fotos.filter(function (_, j) { return j !== i; }), guardada: false });
        } };
      }),
      sinFotos: s.fotos.length === 0,
      agregarFotos: function (e) { self.agregarFotos(e); },
      inclDibujo: s.inclDibujo, inclFotos: s.inclFotos,
      toggleDibujo: function () { self.setState({ inclDibujo: !self.state.inclDibujo }); },
      toggleFotos: function () { self.setState({ inclFotos: !self.state.inclFotos }); },
      ayudaEnvio: !s.guardada ? 'Guarda la sesión para poder enviarla.'
        : puede ? 'WhatsApp abre el menú de compartir con las imágenes: elige WhatsApp y luego el chat del paciente. El texto queda copiado por si WhatsApp no lo muestra: mantén presionado el campo de mensaje y pega.'
        : 'En el computador, WhatsApp y el correo envían el resumen con enlaces privados a las imágenes, válidos por 7 días. En el celular o la tableta las imágenes se envían como fotos.',
      noGuardada: !s.guardada, sinDibujo: !lz || lz.vacio,
      enviarWa: function () {
        var texto = self.mensaje();
        if (puede && (self.state.inclDibujo || self.state.inclFotos)) {
          APP.u.copiar(texto);
          self.archivos().then(function (fs) { return APP.u.compartir('Resumen de tu sesión', texto, fs); })
            .catch(function (e) { self.aviso(e.message, true); });
          return;
        }
        APP.u.abrirLuego(self.enlaces().then(function (ex) { return APP.u.urlWhatsapp(p.celular, texto + ex); }))
          .catch(function (e) { self.aviso(APP.mensajeError(e), true); });
        if (APP.db.demo && (self.state.inclFotos || self.state.inclDibujo)) self.aviso('En modo demostración no se generan enlaces a las imágenes.');
      },
      enviarCorreo: function () {
        var texto = self.mensaje();
        self.enlaces().then(function (ex) { APP.u.correo(p.email, 'Resumen de tu sesión de fisioterapia', texto + ex); })
          .catch(function (e) { self.aviso(APP.mensajeError(e), true); });
      },
      descargarDibujo: function () {
        var lz2 = self.lienzo(); if (!lz2 || lz2.vacio) return;
        var a = document.createElement('a'); a.href = lz2.png(); a.download = 'ejercicio-' + (p.nombre || 'paciente').split(' ')[0].toLowerCase() + '.png';
        document.body.appendChild(a); a.click(); a.remove();
      },
      guardar: function () { self.guardar(); },
      ocupado: s.ocupado,
      textoGuardar: s.ocupado ? 'Guardando…' : s.sesionId ? 'Guardar cambios' : 'Guardar sesión',
      estado: s.estado, estadoColor: s.error ? '#B91C1C' : '#475569'
    };
  }
}
</script>

var TIPOS_DOC = ['CC', 'TI', 'CE', 'Pasaporte', 'Otro'];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = this.vacio(); }
  vacio() {
    return { cargando: true, ocupado: false, estado: '', error: false, paciente: null, tipo: 'iv', textos: {},
      editando: false, borrador: '', relacion: 'paciente', firmante: '', tipoDoc: 'CC', documento: '',
      acepta: false, agujas: false, firmados: [], recordarFirma: true };
  }
  aviso(t, error) { this.setState({ estado: t, error: !!error }); }
  lz(id) { return APP.lienzo(id); }
  plantilla() {
    var id = this.state.tipo, base = PLANTILLAS.find(function (x) { return x.id === id; }) || PLANTILLAS[0];
    var propio = this.state.textos[id];
    return Object.assign({}, base, propio ? { texto: propio.texto, version: propio.version, borrador: false } : { version: 0 });
  }
  alMostrar(params) {
    var self = this, pid = params && params.p;
    var inicial = this.vacio();
    if (params && params.t && PLANTILLAS.some(function (x) { return x.id === params.t; })) inicial.tipo = params.t;
    inicial.volver = params && params.volver === 'sesion';
    inicial.pideAgujas = !!(params && params.agujas);
    this.setState(inicial);
    setTimeout(function () { ['firmaP', 'firmaA'].forEach(function (k) { var l = self.lz(k); if (l) { l.reiniciar(); l.grosor = 5; } }); }, 0);
    if (!pid) { this.aviso('Abre el consentimiento desde la tarjeta del paciente.', true); return; }

      APP.db.listar('pacientes', { eq: [['id', pid]] }),
      APP.db.ajuste('consentimiento_plantillas'),
      APP.db.ajuste('firma_profesional'),
      APP.db.listar('consentimientos', { eq: [['paciente_id', pid]], order: ['firmado_en', false] })

      var p = r[0][0];
      if (!p) { self.aviso('No se encontró el paciente.', true); return; }
      self.setState({ cargando: false, paciente: p, firmante: p.nombre, documento: p.cc || '', textos: r[1] || {}, firmados: r[3] });
      if (r[2]) setTimeout(function () { var l = self.lz('firmaA'); if (l) l.cargar(r[2]); }, 0);
    }).catch(function (e) {
      self.aviso(/consentimientos|ajustes/.test(String(e && e.message)) ? 'Falta ejecutar el script 002_mejoras.sql en Supabase.' : APP.mensajeError(e), true);
    });
  }
  texto() {
    var s = this.state, F = APP.f, pl = this.plantilla();
    var calidad = s.relacion === 'acudiente' && s.paciente ? ', en calidad de responsable de ' + s.paciente.nombre : '';
    var d = new Date();
    var fecha = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear() + ', ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
    var p = s.paciente || {}, edad = '________';
    if (p.fecha_nacimiento) { var n = F.deIso(p.fecha_nacimiento), e = d.getFullYear() - n.getFullYear(); if (d.getMonth() < n.getMonth() || (d.getMonth() === n.getMonth() && d.getDate() < n.getDate())) e--; edad = e + ' años'; }
    var aut = (pl.opciones || []).map(function (o) {
      var marcada = o.id === 'general' ? s.acepta : !!s[o.id];
      return (marcada ? '☒ ' : '☐ ') + o.texto;
    }).join('\n\n');
    return pl.titulo + '\n\n' + pl.texto.replace(/\{paciente_nombre\}/g, p.nombre || '________')
      .replace(/\{paciente_documento\}/g, p.cc ? 'CC ' + p.cc : '________').replace(/\{edad\}/g, edad).replace(/\{autorizacion\}/g, aut)
      .replace(/\{firmante\}/g, s.firmante.trim() || '________')
      .replace(/\{tipo_documento\}/g, s.tipoDoc).replace(/\{documento\}/g, s.documento.trim() || '________')
      .replace(/\{calidad\}/g, calidad).replace(/\{fecha\}/g, fecha)
      .replace(/\{profesional\}/g, (APP.p.nombre() || '________').toUpperCase() + (APP.p.tarjeta() ? ' (' + APP.p.tarjeta() + ')' : ''))
      + '\n\n' + APP.politica.autorizacion();
  }
  firmar() {
    var self = this, s = this.state, lp = this.lz('firmaP'), la = this.lz('firmaA'), pl = this.plantilla();
    if (!s.paciente) return;
    if (!APP.p.completo()) { this.aviso('Antes de firmar, completa tu nombre y tu tarjeta profesional en Mi perfil.', true); return; }
    if (!APP.politica.aceptada()) { this.aviso('Antes de firmar, acepta la política de tratamiento de datos en Mi perfil.', true); return; }
    if (!s.firmante.trim()) { this.aviso('Escribe el nombre de quien firma.', true); return; }
    if (!s.documento.trim()) { this.aviso('Escribe el número de documento.', true); return; }
    if (!s.acepta) { this.aviso('Falta marcar la casilla de aceptación.', true); return; }
    if (!lp || lp.vacio) { this.aviso('Falta la firma ' + (s.relacion === 'acudiente' ? 'del responsable' : 'del paciente') + '.', true); return; }
    if (!la || la.vacio) { this.aviso('Falta tu firma.', true); return; }
    var texto = this.texto(), fp = lp.png(), fa = la.png();
    var datos = { texto: texto, tipo: pl.nombre, firmante: s.firmante.trim(), documento: s.tipoDoc + ' ' + s.documento.trim(), relacion: s.relacion, firma_paciente: fp, firma_profesional: fa };
    this.setState({ ocupado: true }); this.aviso('Guardando…');
    APP.u.sha256(JSON.stringify(datos)).then(function (huella) {
      return APP.db.crear('consentimientos', {
        paciente_id: s.paciente.id, version_texto: pl.version || 1, texto: texto,
        servicios: [pl.nombre].concat((pl.opciones || []).filter(function (o) { return o.registro && s[o.id]; }).map(function (o) { return o.registro; })),
        firmante_nombre: datos.firmante, firmante_documento: datos.documento, firmante_relacion: s.relacion,
        firma_paciente: fp, firma_profesional: fa, huella_sha256: huella, dispositivo: navigator.userAgent.slice(0, 200)
      });
    }).then(function (c) {
      var extra = s.recordarFirma && la.modificado ? APP.db.guardarAjuste('firma_profesional', fa) : Promise.resolve();
      return extra.then(function () { return c; });
    }).then(function (c) {
      lp.reiniciar();
      self.setState({ ocupado: false, acepta: false, firmados: [c].concat(self.state.firmados) });
      if (self.state.volver) {
        self.aviso('Consentimiento firmado. Volviendo a la sesión…');
        setTimeout(function () { location.hash = '#Sesion?reanudar=1'; }, 1500);
      } else {
        self.aviso('Consentimiento firmado y guardado.');
        self.imprimir(c);
      }
    }).catch(function (e) { self.setState({ ocupado: false }); self.aviso('No se pudo guardar: ' + APP.mensajeError(e), true); });
  }
  imprimir(c) {
    var u = APP.u, s = this.state;
    var cuando = c.firmado_en ? new Date(c.firmado_en) : new Date();
    var tipo = (c.servicios && c.servicios[0]) || 'Consentimiento';
    var cuerpo = '<pre style="font-size:11pt">' + u.esc(c.texto) + '</pre>'
      + '<div class="firma"><div><img src="' + c.firma_paciente + '" alt="Firma"><br><b>' + u.esc(c.firmante_nombre) + '</b><br>'
      + (c.firmante_documento ? u.esc(c.firmante_documento) + '<br>' : '') + (c.firmante_relacion === 'acudiente' ? 'Responsable de ' + u.esc(s.paciente.nombre) : 'Paciente') + '</div>'
      + '<div><img src="' + c.firma_profesional + '" alt="Firma"><br>' + APP.p.firmaHtml() + '</div></div>'
      + '<p class="nota">Firmado electrónicamente el ' + u.esc(cuando.toLocaleString('es-CO')) + '. Versión del texto: ' + (c.version_texto || 1)
      + '. Huella SHA-256 del documento: ' + u.esc(c.huella_sha256) + '. Registro ' + u.esc(c.id) + '.</p>';
    u.imprimir('Consentimiento informado – ' + tipo, cuerpo);
  }
  renderVals() {
    var self = this, s = this.state, pl = this.plantilla();

    return {
      volver: !!s.volver, noVolver: !s.volver, irSesion: function () { location.hash = '#Sesion?reanudar=1'; },
      pideAgujas: !!s.pideAgujas && s.tipo === 'fisio',
      subtitulo: s.paciente ? s.paciente.nombre + (s.paciente.cc ? ' · CC ' + s.paciente.cc : '') : (s.cargando ? 'Cargando…' : ''),
      hayFirmados: s.firmados.length > 0,
      firmados: s.firmados.map(function (c) {
        return { fecha: ((c.servicios && c.servicios[0]) || 'Consentimiento') + ' · ' + new Date(c.firmado_en || Date.now()).toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' }),
          detalle: (c.firmante_relacion === 'acudiente' ? 'Firmó como responsable: ' : 'Firmó: ') + c.firmante_nombre,

      tipos: PLANTILLAS.map(function (x) {
        var on = s.tipo === x.id, f = firmadoDe(x.nombre);
        return { nombre: x.nombre, on: on ? 'true' : 'false', bg: on ? '#EFF6FF' : '#FFFFFF', fg: on ? '#1E3A8A' : '#334155', borde: on ? '#1D4ED8' : '#CBD5E1',
          nota: f ? 'Firmado el ' + new Date(f.firmado_en || Date.now()).toLocaleDateString('es-CO') : (x.borrador && !s.textos[x.id] ? 'Pendiente del formato' : 'Sin firmar'),
          notaColor: f ? '#065F46' : '#64748B',
          pick: function () { self.setState({ tipo: x.id, editando: false, acepta: false, agujas: false }); } };

      esBorrador: !!pl.borrador,

        todos[pl.id] = { version: v, texto: t };

        }).catch(function (e) { self.aviso(APP.mensajeError(e), true); });
      },
      textoFinal: this.texto(),
      pacOn: s.relacion === 'paciente' ? 'true' : 'false', acuOn: s.relacion === 'acudiente' ? 'true' : 'false',
      pacBorde: s.relacion === 'paciente' ? '#1D4ED8' : '#CBD5E1', acuBorde: s.relacion === 'acudiente' ? '#1D4ED8' : '#CBD5E1',

      esAcudiente: function () { self.setState({ relacion: 'acudiente', firmante: '', documento: '', tipoDoc: 'CC' }); },
      quienFirma: s.relacion === 'acudiente' ? 'del responsable' : 'del paciente',

<main style="flex: 1 1 560px; min-width: 0; padding: 28px 36px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; max-width: 980px">

<header style="display: flex; flex-direction: column; gap: 4px">
<a href="Pacientes.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none">← Pacientes</a>
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Evolución</h1>
<span style="font-size: 16px; color: #475569">{{subtitulo}}</span>
</header>

<section aria-label="Resumen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<template data-sc="for" list="{{resumen}}" as="r" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 700; color: #475569">{{r.label}}</span>
<span style="font-size: 20px; font-weight: 800; color: {{r.color}}">{{r.valor}}</span>
</div>
</template>
</section>

<template data-sc="if" value="{{revalorar}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F5F3FF; border: 1px solid #DDD6FE; color: #4C1D95">
<span style="flex: 1 1 260px; font-size: 15px; font-weight: 700">{{textoRevalorar}}</span>
<a href="HistoriaClinica.dc.html?p={{pid}}" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #6D28D9; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 14px">Aplicar cuestionario</a>
</div>
</template>

<template data-sc="if" value="{{hayComp}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="t-cmp" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-cmp" style="margin: 0; font-size: 18px; font-weight: 800">Primera valoración ({{comp.desde}}) frente a la última ({{comp.hasta}})</h2>
<span style="font-size: 15px; font-weight: 800">Global: {{comp.global}}</span>
</div>
<template data-sc="for" list="{{comp.filas}}" as="f" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: minmax(130px, 200px) 1fr auto; align-items: center; gap: 10px">
<span style="font-size: 14px; font-weight: 700">{{f.nombre}}</span>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="height: 8px; border-radius: 99px; background: #F1F5F9; overflow: hidden"><div style="height: 8px; border-radius: 99px; background: #CBD5E1; width: {{f.anchoA}}"></div></div>
<div style="height: 8px; border-radius: 99px; background: #F1F5F9; overflow: hidden"><div style="height: 8px; border-radius: 99px; background: {{f.dot}}; width: {{f.anchoB}}"></div></div>
</div>
<span style="font-size: 14px; font-weight: 800; color: {{f.color}}; min-width: 90px; text-align: right">{{f.antes}} → {{f.ahora}} · {{f.cambio}}</span>
</div>
</template>
<span style="font-size: 13px; color: #475569">Barra gris: primera valoración. Barra de color: última valoración.</span>
</section>
</template>

<div role="tablist" aria-label="Filtrar" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{filtros}}" as="f" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid {{f.borde}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{f.label}}</button>
</template>
</div>

<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<template data-sc="for" list="{{eventos}}" as="e" hint-placeholder-count="3">
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; flex: none; width: 52px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: {{e.bg}}; color: {{e.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05"><span style="font-size: 18px; font-weight: 800">{{e.dia}}</span><span style="font-size: 11px; font-weight: 800; text-transform: uppercase">{{e.mes}}</span></span>
<span style="flex: 1; width: 2px; background: #E2E8F0; margin-top: 6px"></span>
</div>
<article style="flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">{{e.titulo}}</h2>
<span style="padding: 4px 12px; border-radius: 999px; background: {{e.bg}}; color: {{e.fg}}; font-size: 13px; font-weight: 800">{{e.etiqueta}}</span>
</div>
<template data-sc="if" value="{{e.hayResumen}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 800; color: #475569">{{e.tituloResumen}}</span><p style="margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap">{{e.resumen}}</p></div></template>
<template data-sc="if" value="{{e.hayNotas}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F8FAFC"><span style="font-size: 13px; font-weight: 800; color: #475569">{{e.tituloNotas}}</span><p style="margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap">{{e.notas}}</p></div></template>
<template data-sc="if" value="{{e.hayEjercicios}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 800; color: #047857">Ejercicios para casa</span><p style="margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap">{{e.ejercicios}}</p></div></template>
<template data-sc="if" value="{{e.hayImagenes}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{e.imagenes}}" as="im" hint-placeholder-count="2">
<a href="{{im.url}}" target="_blank" rel="noopener" style="display: block; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: #F1F5F9; border: 1px solid #E2E8F0"><img src="{{im.url}}" alt="{{im.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></a>
</template>
</div>
</template>
<a href="{{e.enlace}}" style="align-self: flex-start; font-size: 14px; font-weight: 800; text-decoration: none">{{e.textoEnlace}}</a>
</article>
</li>
</template>
</ol>
<template data-sc="if" value="{{vacio}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px; border-radius: 18px; background: #FFFFFF; border: 1px dashed #CBD5E1; text-align: center; color: #475569">{{textoVacio}}</p></template>

<div class="barra-acciones">
<span class="espacio"></span>
<button type="button" onClick="{{imprimir}}" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer" aria-label="Imprimir o guardar la evolución en PDF"><span class="txt-largo">Imprimir evolución</span><span class="txt-corto">PDF</span></button>
<a href="Sesion.dc.html?p={{pid}}" style="min-height: 54px; display: inline-flex; align-items: center; padding: 0 28px; border-radius: 999px; background: #1E3A8A; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 17px; box-shadow: 0 6px 16px rgba(30, 58, 138, 0.25)">Registrar sesión</a>
</div>
</main>
</div>
</script>
<script type="text/x-component" id="js-Evolucion">
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = this.vacio(); }
  vacio() { return { cargando: true, error: '', paciente: null, sesiones: [], historias: [], consentimientos: [], urls: {}, filtro: 'todo' }; }
  alMostrar(params) {
    var self = this, pid = params && params.p;
    this.setState(this.vacio());
    if (!pid) { this.setState({ cargando: false, error: 'Abre la evolución desde la tarjeta del paciente.' }); return; }
    Promise.all([
      APP.db.listar('pacientes', { eq: [['id', pid]] }),
      APP.db.listar('sesiones', { eq: [['paciente_id', pid]], order: ['fecha', false] }),
      APP.db.listar('historias', { eq: [['paciente_id', pid]], order: ['created_at', false] }),
      APP.db.listar('consentimientos', { eq: [['paciente_id', pid]] }).catch(function () { return []; })
    ]).then(function (r) {
      self.setState({ cargando: false, paciente: r[0][0] || null, sesiones: r[1], historias: r[2], consentimientos: r[3] });
      self.cargarImagenes(r[1].slice(0, 30));
    }).catch(function (e) { self.setState({ cargando: false, error: APP.mensajeError(e) }); });
  }
  cargarImagenes(sesiones) {
    var self = this, rutas = [];
    sesiones.forEach(function (x) {
      if (x.dibujo) rutas.push(x.dibujo);
      (Array.isArray(x.fotos) ? x.fotos : []).forEach(function (f) { rutas.push(f); });
    });
    rutas.forEach(function (r) {
      APP.db.url(r).then(function (u) {
        var m = Object.assign({}, self.state.urls); m[r] = u; self.setState({ urls: m });
      }).catch(function () {});
    });
  }
  eventos() {
    var s = this.state, F = APP.f, lista = [];
    var orden = s.sesiones.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
    var numero = {};
    orden.forEach(function (x, i) { numero[x.id] = i + 1; });
    if (s.filtro === 'todo' || s.filtro === 'sesiones') s.sesiones.forEach(function (x) {
      var imgs = [];
      if (x.dibujo && s.urls[x.dibujo]) imgs.push({ url: s.urls[x.dibujo], alt: 'Dibujo de la sesión' });
      (Array.isArray(x.fotos) ? x.fotos : []).forEach(function (f, i) { if (s.urls[f]) imgs.push({ url: s.urls[f], alt: 'Foto de evidencia ' + (i + 1) }); });
      lista.push({ fecha: x.fecha, tipo: 'sesion', titulo: 'Sesión ' + numero[x.id] + (s.paciente && s.paciente.plan_sesiones ? ' de ' + s.paciente.plan_sesiones : ''),
        etiqueta: x.servicio || 'Sesión', bg: '#DBEAFE', fg: '#1E3A8A', tituloResumen: 'Lo que se realizó', tituloNotas: 'Notas clínicas (privadas)',
        resumen: x.resumen || '', notas: x.notas || '', ejercicios: x.ejercicios || '', imagenes: imgs,
        enlace: 'Sesion.dc.html?s=' + x.id, textoEnlace: 'Abrir sesión completa', orden: x.created_at || x.fecha });
    });
    if (s.filtro === 'todo' || s.filtro === 'valoraciones') s.historias.forEach(function (h) {
      var fecha = F.local(h.created_at);
      var conDx = !!h.nivel;
      lista.push({ fecha: fecha, tipo: 'valoracion', titulo: conDx ? 'Valoración y cuestionario detox' : 'Valoración inicial', etiqueta: conDx ? 'Detox ' + h.nivel + ' · ' + (h.puntaje_global || 0) + ' pts' : (((h.objetivos || {})._servicios || []).join(', ') || 'Valoración'),
        bg: '#EDE9FE', fg: '#5B21B6', tituloResumen: 'Motivo de consulta', resumen: h.motivo || '',
        notas: [(h.cie10 || []).map(function (c) { return c.codigo + ' ' + c.descripcion; }).join(' · '), h.diagnostico_fisio || ''].filter(Boolean).join('\n'), tituloNotas: 'Diagnóstico', ejercicios: '', imagenes: [],
        enlace: 'HistoriaClinica.dc.html?p=' + h.paciente_id, textoEnlace: 'Abrir historia clínica', orden: h.created_at || fecha });
    });
    if (s.filtro === 'todo' || s.filtro === 'consentimientos') s.consentimientos.forEach(function (c) {
      var fecha = F.local(c.firmado_en);
      lista.push({ fecha: fecha, tipo: 'consentimiento', titulo: 'Consentimiento firmado', etiqueta: (c.servicios && c.servicios[0]) || 'Consentimiento',
        bg: '#D1FAE5', fg: '#065F46', tituloResumen: 'Firma', tituloNotas: '', resumen: 'Firmó ' + c.firmante_nombre + (c.firmante_relacion === 'acudiente' ? ' (responsable)' : ''), notas: '', ejercicios: '', imagenes: [],
        enlace: 'Consentimiento.dc.html?p=' + c.paciente_id, textoEnlace: 'Ver o imprimir', orden: c.firmado_en || fecha });
    });
    lista.sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.orden < b.orden ? 1 : -1); });
    return lista;
  }
  imprimir() {
    var s = this.state, u = APP.u, F = APP.f, e = u.esc, p = s.paciente || {};
    var ses = s.sesiones.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
    var cuerpo = '<h2>Paciente</h2><div class="grid"><div><span class="k">Nombre:</span> ' + e(p.nombre) + '</div><div><span class="k">Cédula:</span> ' + e(p.cc || '—') + '</div>'
      + '<div><span class="k">Sesiones realizadas:</span> ' + ses.length + (p.plan_sesiones ? ' de ' + p.plan_sesiones : '') + '</div><div><span class="k">Celular:</span> ' + e(p.celular || '—') + '</div></div>'
      + '<h2>Registro de evolución</h2>'
      + (ses.length ? '<table><tr><th style="width:90px">Fecha</th><th style="width:130px">Terapia</th><th>Evolución</th></tr>' + ses.map(function (x, i) {
        var t = '';
        if (x.resumen) t += '<b>Realizado:</b> ' + e(x.resumen) + '<br>';
        if (x.notas) t += '<b>Notas clínicas:</b> ' + e(x.notas) + '<br>';
        if (x.ejercicios) t += '<b>Ejercicios para casa:</b> ' + e(x.ejercicios) + '<br>';
        var n = (Array.isArray(x.fotos) ? x.fotos.length : 0);
        if (n || x.dibujo) t += '<span class="k">' + (x.dibujo ? 'Con dibujo. ' : '') + (n ? n + ' foto(s) de evidencia.' : '') + '</span>';
        return '<tr><td>' + (i + 1) + '. ' + e(x.fecha) + '</td><td>' + e(x.servicio || '—') + '</td><td>' + (t || '—') + '</td></tr>';
      }).join('') + '</table>' : '<p>No hay sesiones registradas.</p>')
      + (s.historias.length ? '<h2>Valoraciones</h2>' + s.historias.map(function (h) {
        return '<p>' + e(F.local(h.created_at)) + ': cuestionario detox ' + e(h.nivel || '—') + ' (' + (h.puntaje_global || 0) + ' pts).</p>';
      }).join('') : '')
      + '<div class="firma"><div><div class="linea"></div>' + APP.p.firmaHtml() + '</div></div>'
      + '<p class="nota">Documento generado el ' + e(new Date().toLocaleString('es-CO')) + '.</p>';
    u.imprimir('Evolución – ' + (p.nombre || 'Paciente'), cuerpo);
  }
  renderVals() {
    var self = this, s = this.state, F = APP.f, p = s.paciente;
    var ev = this.eventos();
    var ult = s.sesiones[0], conDetox = s.historias.filter(function (h) { return !!h.nivel; }), hc = conDetox[0];
    var desde = hc ? s.sesiones.filter(function (x) { return x.fecha >= F.local(hc.created_at); }).length : s.sesiones.length;
    var revalorar = !!hc && desde >= APP.REVALORAR_CADA;
    var comp = null;
    if (conDetox.length >= 2) {
      var ini = conDetox[conDetox.length - 1], fin = conDetox[0];
      var a = APP.totalesDetox(ini.detox), b = APP.totalesDetox(fin.detox);
      comp = { desde: F.corta(F.local(ini.created_at)), hasta: F.corta(F.local(fin.created_at)),
        global: (ini.puntaje_global || 0) + ' → ' + (fin.puntaje_global || 0),
        filas: a.map(function (x, i) {
          var c = b[i].total - x.total;
          return { nombre: x.nombre, dot: x.dot, antes: x.total, ahora: b[i].total,
            anchoA: Math.round(x.total / x.max * 100) + '%', anchoB: Math.round(b[i].total / x.max * 100) + '%',
            cambio: c === 0 ? 'Igual' : (c > 0 ? '▲ +' + c : '▼ ' + c), color: c > 0 ? '#B91C1C' : c < 0 ? '#047857' : '#475569' };
        }) };
    }
    var opciones = [{ k: 'todo', l: 'Todo' }, { k: 'sesiones', l: 'Sesiones (' + s.sesiones.length + ')' }, { k: 'valoraciones', l: 'Valoraciones (' + s.historias.length + ')' }, { k: 'consentimientos', l: 'Consentimientos (' + s.consentimientos.length + ')' }];
    return {
      subtitulo: s.error || (p ? p.nombre + (p.cc ? ' · CC ' + p.cc : '') : (s.cargando ? 'Cargando…' : 'Paciente no encontrado')),
      pid: p ? p.id : '',
      resumen: [
        { label: 'Sesiones realizadas', valor: s.sesiones.length + (p && p.plan_sesiones ? ' de ' + p.plan_sesiones : ''), color: '#1E3A8A' },
        { label: 'Última sesión', valor: ult ? F.cap(F.corta(ult.fecha)) : '—', color: '#0F2A4A' },
        { label: 'Última terapia', valor: ult ? (ult.servicio || '—') : '—', color: '#0F2A4A' },
        { label: 'Último cuestionario detox', valor: hc ? hc.nivel + ' · ' + (hc.puntaje_global || 0) : 'No aplica', color: '#5B21B6' }
      ],
      filtros: opciones.map(function (o) {
        var on = s.filtro === o.k;
        return { label: o.l, on: on ? 'true' : 'false', bg: on ? '#1D4ED8' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F2A4A', borde: on ? '#1D4ED8' : '#CBD5E1',
          pick: function () { self.setState({ filtro: o.k }); } };
      }),
      eventos: ev.map(function (x) {
        var d = F.deIso(x.fecha);
        return Object.assign({}, x, { dia: d.getDate(), mes: MESES[d.getMonth()],
          hayResumen: !!x.resumen, hayNotas: !!x.notas, hayEjercicios: !!x.ejercicios, hayImagenes: x.imagenes.length > 0 });
      }),
      revalorar: revalorar,
      textoRevalorar: 'Han pasado ' + desde + ' sesiones desde el último cuestionario detox: es buen momento para repetirlo.',
      hayComp: !!comp, comp: comp || {},
      vacio: ev.length === 0,
      textoVacio: s.cargando ? 'Cargando…' : 'Todavía no hay registros. Empieza con "Registrar sesión".',
      imprimir: function () { self.imprimir(); }
    };
  }
}
</script>

<main style="flex: 1 1 560px; min-width: 0; padding: 28px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; max-width: 1000px">

<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Códigos CIE-10</h1>
<span style="font-size: 15px; color: #475569">Busca por palabra o código, o recorre el catálogo por capítulos.</span>
</header>

<div style="position: relative">
<label for="cie-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar código CIE-10</label>
<input id="cie-q" type="search" autocomplete="off" value="{{q}}" onChange="{{setQ}}" placeholder="Ej.: hombro, lumbago, rodilla, M755…" style="width: 100%; min-height: 54px; padding: 0 18px; border: 1.5px solid #CBD5E1; border-radius: 999px; font-family: inherit; font-size: 16px; color: #0F2A4A; background: #FFFFFF">
</div>
<template data-sc="if" value="{{hayEstado}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 14px; font-weight: 700; color: {{estadoColor}}">{{estado}}</p></template>

<template data-sc="if" value="{{hayMigas}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Ubicación en el catálogo" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px">
<template data-sc="for" list="{{migas}}" as="m" hint-placeholder-count="2">
<button type="button" onClick="{{m.ir}}" style="min-height: 36px; padding: 0 10px; border-radius: 999px; border: 0; background: {{m.bg}}; color: #1D4ED8; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">{{m.texto}}</button>
</template>
</nav>
</template>

<template data-sc="if" value="{{verFrecuentes}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="t-frec" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="t-frec" style="margin: 0; font-size: 18px; font-weight: 800">Los que más usas</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{frecuentes}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.copiar}}" title="Copiar" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #BFDBFE; background: #EFF6FF; color: #1E3A8A; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><strong>{{f.codigo}}</strong> {{f.descripcion}} · {{f.n}}</button>
</template>
</div>
</section>
</template>

<template data-sc="if" value="{{verCapitulos}}" hint-placeholder-val="{{ true }}">
<section aria-label="Capítulos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px">
<template data-sc="for" list="{{capitulos}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.abrir}}" style="min-height: 76px; padding: 12px 16px; border-radius: 16px; border: 1px solid {{c.borde}}; background: {{c.bg}}; color: #0F2A4A; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer">
<span style="font-size: 12.5px; font-weight: 800; color: {{c.fg}}">Capítulo {{c.n}} · {{c.rango}}{{c.marca}}</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{c.nombre}}</span>
</button>
</template>
</section>
</template>

<template data-sc="if" value="{{verSecciones}}" hint-placeholder-val="{{ false }}">
<section aria-label="Grupos del capítulo" style="display: flex; flex-direction: column; gap: 6px">
<template data-sc="for" list="{{secciones}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.abrir}}" style="min-height: 52px; padding: 8px 16px; border-radius: 14px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #0F2A4A; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="font-size: 13px; font-weight: 800; color: #1D4ED8; min-width: 78px">{{s.rango}}</span><span style="font-size: 15px; font-weight: 600">{{s.nombre}}</span>
</button>
</template>
</section>
</template>

<template data-sc="if" value="{{verCodigos}}" hint-placeholder-val="{{ false }}">
<section aria-label="Códigos" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; overflow: hidden">
<template data-sc="for" list="{{codigos}}" as="x" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #F1F5F9; background: {{x.bg}}">
<span style="font-weight: 800; color: #1D4ED8; min-width: 52px; font-size: {{x.tam}}">{{x.codigo}}</span>
<span style="flex: 1; font-size: {{x.tam}}; font-weight: {{x.peso}}">{{x.descripcion}}</span>
<button type="button" onClick="{{x.copiar}}" aria-label="Copiar {{x.codigo}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Copiar</button>
</div>
</template>
<template data-sc="if" value="{{sinCodigos}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 18px; color: #475569">No hay códigos con esas palabras.</p></template>
<template data-sc="if" value="{{hayMas}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 12px 16px; font-size: 14px; color: #475569">{{textoMas}}</p></template>
</section>
</template>

<p style="margin: 0; font-size: 12.5px; color: #64748B">Catálogo CIE-10 en español (versión OPS/OMS, catálogo MINSAL/DEIS 2018). Para facturación con EPS, verifica el código en la tabla oficial de SISPRO.</p>
</main>

<template data-sc="if" value="{{hayToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #0F2A4A; color: #FFFFFF; padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 700; z-index: 30">{{toast}}</div>
</template>
</div>
</script>

<main style="flex: 1 1 560px; min-width: 0; padding: 28px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; max-width: 960px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Mi plan</h1>
<span style="font-size: 15px; color: #475569">Lo que llevas usado y lo que pagas por el software cada mes.</span>
</div>
<button type="button" onClick="{{imprimir}}" disabled="{{cargando}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer">Imprimir reporte</button>
</header>

<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{anterior}}" aria-label="Mes anterior" style="width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-size: 20px; font-weight: 800; cursor: pointer">‹</button>
<div style="display: flex; flex-direction: column; min-width: 170px"><b style="font-size: 20px">{{titulo}}</b><span style="font-size: 13px; color: #64748B">{{periodo}}</span></div>
<button type="button" onClick="{{siguiente}}" disabled="{{sinSiguiente}}" aria-label="Mes siguiente" style="width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-size: 20px; font-weight: 800; cursor: pointer">›</button>
<template data-sc="if" value="{{cargando}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 14px; color: #64748B">Cargando…</span></template>
</div>

<template data-sc="if" value="{{hayError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #FDECEC; color: #9B1C1C; font-size: 15px; font-weight: 700">{{error}}</p></template>

<template data-sc="if" value="{{hayDatos}}" hint-placeholder-val="{{ true }}">
<section aria-label="Valor del mes" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span style="font-size: 16px; font-weight: 800">{{plan}}</span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{estBg}}; color: {{estFg}}; font-size: 12px; font-weight: 800">{{estado}}</span>
</div>
<span style="font-size: 14px; font-weight: 700; color: #475569">{{etiquetaValor}}</span>
<b style="font-size: 40px; font-weight: 800; line-height: 1.05">{{valor}} <span style="font-size: 16px; font-weight: 700; color: #64748B">COP</span></b>
<span style="font-size: 14px; color: #475569">{{detalle}}</span>
<template data-sc="if" value="{{hayProy}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 700; color: #0F2A4A">{{proy}}</span></template>
<span style="font-size: 13.5px; color: #64748B">{{pago}}</span>
</section>

<template data-sc="if" value="{{hayAviso}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FFF7ED; color: #9A3412; font-size: 14.5px; font-weight: 700">{{aviso}}</p></template>

<section aria-labelledby="t-uso" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="t-uso" style="margin: 0; font-size: 18px; font-weight: 800">Tu uso del mes</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px">
<template data-sc="for" list="{{usos}}" as="x" hint-placeholder-count="6">
<div style="background: #F8FAFC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 22px; font-weight: 800">{{x.v}}</b><span style="font-size: 12.5px; color: #64748B">{{x.t}}</span></div>
</template>
</div>
<template data-sc="if" value="{{hayLimite}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13.5px; font-weight: 700; color: #475569">{{limiteTxt}}</span>
<div style="height: 10px; border-radius: 99px; background: #E6EEF8; overflow: hidden"><div style="height: 10px; border-radius: 99px; background: {{limiteColor}}; width: {{limitePct}}"></div></div>
</div>
</template>
<p style="margin: 0; font-size: 12.5px; color: #64748B">Un paciente atendido es el que tiene al menos una sesión registrada en el mes.</p>
</section>

<section aria-labelledby="t-mod" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="t-mod" style="margin: 0; font-size: 18px; font-weight: 800">Cuánto pagarías en cada plan con este uso</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px">
<template data-sc="for" list="{{opciones}}" as="o" hint-placeholder-count="4">
<div style="border: 1.5px solid {{o.borde}}; background: {{o.bg}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #334155">{{o.label}}</span><b style="font-size: 20px">{{o.v}}</b><span style="font-size: 12.5px; color: #64748B">{{o.nota}}</span>
</div>
</template>
</div>
<p style="margin: 0; font-size: 12.5px; color: #64748B">Puedes cambiar de plan cuando quieras; el nuevo valor aplica desde el mes siguiente.</p>
</section>

<section aria-labelledby="t-hist" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<h2 id="t-hist" style="margin: 0; font-size: 18px; font-weight: 800">Sesiones de los últimos 6 meses</h2>
<div role="img" aria-label="Sesiones registradas por mes" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; height: 100px; border-bottom: 1px solid #E2E8F0">
<template data-sc="for" list="{{meses}}" as="b" hint-placeholder-count="6">
<div title="{{b.titulo}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%">
<span style="font-size: 12px; font-weight: {{b.peso}}; color: #334155">{{b.n}}</span>
<div style="width: 60%; max-width: 34px; height: {{b.alto}}; background: {{b.color}}; border-radius: 4px 4px 0 0"></div>
</div>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<template data-sc="for" list="{{meses}}" as="b" hint-placeholder-count="6"><span style="text-align: center; font-size: 12px; color: #64748B; font-weight: {{b.peso}}">{{b.mes}}</span></template>
</div>
</section>
</template>
</main>
</div>
</script>
<script type="text/x-component" id="js-MiPlan">
var MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function finMes(m) { var p = m.split('-'); return APP.f.iso(new Date(+p[0], +p[1], 0)); }
function mesTexto(m) { return APP.f.cap(APP.f.mes(m + '-01')) + ' ' + m.slice(0, 4); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mes: APP.f.hoy().slice(0, 7), cargando: true, error: '', yo: null, historial: [], T: Object.assign({}, APP.cobro.TARIFAS_BASE) };
  }
  alMostrar() { this.cargar(); }
  rango() {
    var m = this.state.mes, hoy = APP.f.hoy(), fin = finMes(m);
    return { desde: m + '-01', hasta: fin > hoy ? hoy : fin, finMes: fin, enCurso: fin >= hoy };
  }
  cargar() {
    var self = this, r = this.rango();
    var d6 = APP.f.deIso(r.desde); d6.setMonth(d6.getMonth() - 5);
    this.setState({ cargando: true, error: '' });
    Promise.all([
      APP.db.rpc('mi_uso', { desde: r.desde, hasta: r.hasta }),
      APP.db.rpc('mi_mensual', { desde: APP.f.iso(d6) }),
      APP.cobro.tarifas()
    ]).then(function (x) {
      self.setState({ cargando: false, yo: (x[0] || [])[0] || null, historial: x[1] || [], T: x[2] });
    }).catch(function (e) { self.setState({ cargando: false, error: APP.mensajeError(e) }); });
  }
  cambiarMes(n) {
    var p = this.state.mes.split('-'), m = APP.f.iso(new Date(+p[0], +p[1] - 1 + n, 1)).slice(0, 7);
    if (m > APP.f.hoy().slice(0, 7)) return;
    this.setState({ mes: m }); this.cargar();
  }
  calculo() {
    var s = this.state, u = s.yo, T = s.T, r = this.rango(), C = APP.cobro;
    if (!u) return null;
    var c = C.cobro(u, T, r.finMes), proy = null;
    if (c.porUso && r.enCurso && c.valor > 0) {
      var dia = +r.hasta.slice(8, 10), dias = +r.finMes.slice(8, 10);
      proy = Math.min(T.tope, Math.round(c.valor * dias / dia / 500) * 500);
    }
    return { u: u, c: c, proy: proy, m: C.modalidades(u, T) };
  }
  imprimir() {
    var k = this.calculo(); if (!k) return;
    var s = this.state, r = this.rango(), T = s.T, C = APP.cobro, esc = APP.u.esc, u = k.u;
    var fila = function (a, b) { return '<tr><th style="width:55%">' + esc(a) + '</th><td>' + esc(String(b)) + '</td></tr>'; };
    var cuerpo = '<div class="grid"><p><span class="k">Profesional:</span> ' + esc(u.nombre || u.email) + '</p><p><span class="k">Plan:</span> ' + esc(C.nombrePlan(u.plan)) + '</p>'
      + '<p><span class="k">Periodo:</span> ' + esc(APP.f.corta(r.desde) + ' al ' + APP.f.corta(r.hasta) + ' de ' + r.desde.slice(0, 4)) + '</p><p><span class="k">Cuenta:</span> ' + esc(u.email) + '</p></div>'
      + '<h2>Uso registrado</h2><table>' + fila('Pacientes atendidos (con al menos una sesión)', u.pacientes_atendidos) + fila('Sesiones registradas', u.sesiones)
      + fila('Pacientes nuevos', u.pacientes_nuevos) + fila('Citas agendadas', u.citas) + fila('Historias clínicas creadas', u.historias)
      + fila('Consentimientos firmados', u.consentimientos) + '</table>'
      + '<h2>Valor del servicio</h2><table>' + fila('Cálculo', k.c.detalle) + '<tr><th>' + (k.c.porUso && r.enCurso ? 'Acumulado hasta hoy' : 'Total del mes') + '</th><td><b>' + esc(C.cop(k.c.valor)) + ' COP</b></td></tr>'
      + (k.proy !== null ? fila('Proyección al cierre del mes', C.cop(k.proy) + ' COP') : '') + '</table>'
      + '<p class="nota">Tarifas vigentes: Plan Inicio ' + esc(C.cop(T.inicio)) + ', Plan Profesional ' + esc(C.cop(T.profesional)) + ', por sesión ' + esc(C.cop(T.por_sesion)) + ', por paciente ' + esc(C.cop(T.por_paciente)) + ' (tope ' + esc(C.cop(T.tope)) + ').</p>';
    APP.u.imprimir('Mi plan YoFisio · ' + mesTexto(s.mes), cuerpo);
  }
  renderVals() {
    var self = this, s = this.state, r = this.rango(), T = s.T, C = APP.cobro, k = this.calculo();
    var u = k && k.u;
    var vals = {
      titulo: mesTexto(s.mes),
      periodo: r.enCurso ? 'Del ' + APP.f.corta(r.desde) + ' a hoy, ' + APP.f.corta(r.hasta) : 'Del ' + APP.f.corta(r.desde) + ' al ' + APP.f.corta(r.hasta),
      anterior: function () { self.cambiarMes(-1); }, siguiente: function () { self.cambiarMes(1); },
      sinSiguiente: s.mes >= APP.f.hoy().slice(0, 7),
      cargando: s.cargando, hayError: !!s.error, error: s.error,
      hayDatos: !!k, imprimir: function () { self.imprimir(); }
    };
    if (!k) return Object.assign(vals, { plan: '', estado: '', valor: '', etiquetaValor: '', detalle: '', hayProy: false, proy: '', pago: '', hayAviso: false, aviso: '',
      usos: [], hayLimite: false, limiteTxt: '', limitePct: '0%', limiteColor: '#2563EB', opciones: [], meses: [] });
    var c = k.c, activa = u.estado === 'activa';
    var pago;
    if (!activa || u.plan === 'cortesia' || u.plan === 'prueba') pago = 'Este mes no tienes valor a pagar.';
    else if (c.porUso) pago = 'Se paga a mes vencido: hasta el 5 de ' + APP.f.mes(APP.f.sumar(r.finMes, 1)) + ', según el reporte de uso.';
    else pago = 'Se paga por mes anticipado, dentro de los primeros 5 días de cada mes.';
    var aviso = '';
    if (c.vencida) aviso = c.detalle + '. Escríbenos para activar tu plan.';
    else if (u.plan === 'prueba' && c.finPrueba) {
      var quedan = Math.round((APP.f.deIso(c.finPrueba) - APP.f.deIso(APP.f.hoy())) / 864e5);
      if (quedan >= 0 && quedan <= 7) aviso = 'Tu prueba gratis termina en ' + quedan + (quedan === 1 ? ' día' : ' días') + '. Revisa abajo qué plan te conviene según tu uso.';
    } else if (c.excede) aviso = 'Este mes superaste el límite del Plan Inicio (' + u.pacientes_atendidos + ' de ' + T.limite_inicio + ' pacientes atendidos). Si se repite el próximo mes, te propondremos el Plan Profesional.';
    if (u.estado === 'suspendida') aviso = 'Tu cuenta está suspendida. Comunícate con soporte para reactivarla.';
    var ops = [
      { k: 'inicio', label: 'Plan Inicio', v: k.m.inicio, nota: 'hasta ' + T.limite_inicio + ' pacientes', ok: u.pacientes_atendidos <= T.limite_inicio },
      { k: 'profesional', label: 'Plan Profesional', v: k.m.profesional, nota: 'pacientes ilimitados', ok: true },
      { k: 'por_sesion', label: 'Pago por sesión', v: k.m.por_sesion, nota: u.sesiones + ' × ' + C.cop(T.por_sesion), ok: true },
      { k: 'por_paciente', label: 'Pago por paciente', v: k.m.por_paciente, nota: u.pacientes_atendidos + ' × ' + C.cop(T.por_paciente), ok: true }
    ];
    var validas = ops.filter(function (o) { return o.ok; });
    var menor = validas.reduce(function (a, o) { return o.v < a.v ? o : a; }, validas[0]);
    var max = Math.max.apply(null, s.historial.map(function (h) { return +h.sesiones; }).concat([1]));
    var meses = [], d = APP.f.deIso(r.desde); d.setMonth(d.getMonth() - 5);
    for (var i = 0; i < 6; i++) {
      var mm = APP.f.iso(d).slice(0, 7), h = s.historial.find(function (x) { return String(x.mes).slice(0, 7) === mm; }) || { sesiones: 0, pacientes_atendidos: 0 };
      var vm = C.cobro(Object.assign({}, u, { sesiones: +h.sesiones, pacientes_atendidos: +h.pacientes_atendidos }), T, finMes(mm)).valor;
      meses.push({ mes: MESES_C[d.getMonth()], n: +h.sesiones, alto: Math.max(2, Math.round(+h.sesiones / max * 64)) + 'px',
        color: mm === s.mes ? '#BE185D' : '#F9A8D4', peso: mm === s.mes ? '800' : '600', titulo: h.sesiones + ' sesiones · ' + h.pacientes_atendidos + ' pacientes · ' + C.cop(vm) });
      d.setMonth(d.getMonth() + 1);
    }
    var limitePct = Math.min(100, Math.round(u.pacientes_atendidos / Math.max(1, T.limite_inicio) * 100));
    return Object.assign(vals, {
      plan: C.nombrePlan(u.plan), estado: APP.f.cap(u.estado),
      estBg: activa ? '#D1FAE5' : '#FEE2E2', estFg: activa ? '#065F46' : '#991B1B',
      etiquetaValor: c.porUso && r.enCurso ? 'Llevas acumulado este mes' : r.enCurso ? 'Valor de este mes' : 'Total del mes',
      valor: C.cop(c.valor), detalle: c.detalle,
      hayProy: k.proy !== null, proy: k.proy !== null ? 'Si sigues a este ritmo, cerrarías el mes en ' + C.cop(k.proy) + '.' : '',
      pago: pago, hayAviso: !!aviso, aviso: aviso,
      usos: [
        { t: 'Pacientes atendidos', v: u.pacientes_atendidos }, { t: 'Sesiones registradas', v: u.sesiones },
        { t: 'Pacientes nuevos', v: u.pacientes_nuevos }, { t: 'Citas agendadas', v: u.citas },
        { t: 'Historias clínicas', v: u.historias }, { t: 'Consentimientos', v: u.consentimientos }
      ],
      hayLimite: u.plan === 'inicio', limiteTxt: u.pacientes_atendidos + ' de ' + T.limite_inicio + ' pacientes del Plan Inicio',
      limitePct: limitePct + '%', limiteColor: limitePct >= 100 ? '#DC2626' : limitePct >= 80 ? '#F59E0B' : '#2563EB',
      opciones: ops.map(function (o) {
        var on = o.k === u.plan;
        return { label: o.label + (on ? ' · tu plan' : ''), v: C.cop(o.v), nota: o.nota + (o.k === menor.k ? ' · la más económica' : '') + (o.ok ? '' : ' · superas el límite'),
          bg: on ? '#FDF2F8' : '#FFFFFF', borde: on ? '#BE185D' : '#E2E8F0' };
      }),
      meses: meses
    });
  }
}
</script>

<main style="flex: 1 1 560px; min-width: 0; padding: 28px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; max-width: 920px">

<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px">
<h2 id="t-foto" style="margin: 0; font-size: 18px; font-weight: 800">Foto <span style="font-weight: 600; color: #64748B; font-size: 14px">(opcional)</span></h2>
<span style="font-size: 14px; color: #475569">Se muestra en el menú. Usa una foto de frente, con buena luz.</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<label style="position: relative; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #BE185D; color: #FFFFFF; font-weight: 800; font-size: 14px; display: flex; align-items: center; cursor: pointer">Subir foto<input type="file" accept="image/*" onChange="{{elegirFoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
<template data-sc="if" value="{{hayFoto}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{quitarFoto}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #475569; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Quitar</button></template>

</div>
</section>

<section aria-labelledby="t-datos" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px">

<div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="pf-perfil" style="font-size: 14px; font-weight: 700">Perfil profesional</label><textarea id="pf-perfil" rows="4" value="{{f.perfil}}" onChange="{{set.perfil}}" placeholder="Describe tu experiencia y tu enfoque de atención en pocas líneas." style="padding: 10px 14px; border: 1.5px solid #C8D9EF; border-radius: 12px; font-family: inherit; font-size: 15px; color: #0F2A4A; resize: vertical"></textarea></div>

<div class="barra-acciones">

<span class="espacio"></span>
<button type="submit" disabled="{{ocupado}}" style="min-height: 52px; padding: 0 28px; border-radius: 999px; border: 0; background: #BE185D; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Guardar perfil</button>
</div>
</form>

<section aria-labelledby="t-politica" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><h2 id="t-politica" style="margin: 0; font-size: 18px; font-weight: 800">Política de tratamiento de datos</h2>

<span style="font-size: 14px; color: #475569">Es la misma para todas las profesionales que usan YoFisio y cumple la Ley 1581 de 2012. Se completa con tus datos del perfil y no se puede editar. Al aceptarla, la adoptas como tu política frente a tus pacientes, y cada consentimiento incluye su autorización para tratar sus datos de salud.</span>

</div>
<template data-sc="if" value="{{hayAvisoPol}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; font-weight: 700; color: #9A3412">{{avisoPol}}</span></template>

<section aria-labelledby="t-plan" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px">

<section aria-labelledby="t-cuenta" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="t-cuenta" style="margin: 0; font-size: 18px; font-weight: 800">Cuenta y seguridad</h2>
