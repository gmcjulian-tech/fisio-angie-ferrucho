<script type="text/x-component" id="js-Perfil">
var CAMPOS = ['nombre', 'profesion', 'tipo_documento', 'documento', 'tarjeta', 'reps', 'especialidades', 'formacion', 'perfil', 'celular', 'correo', 'ciudad', 'direccion'];
var TIPOS_DOC = ['CC', 'CE', 'Pasaporte', 'Otro'];
var TABLAS = ['pacientes', 'citas', 'sesiones', 'historias', 'consentimientos', 'servicios', 'ajustes'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: this.desde(APP.perfil), foto: APP.perfil.foto || '', cuenta: '', ocupado: false, estado: '', error: false,
      plan: null, firmaGuardada: false, firmaCambio: false, exportando: false, verPolitica: false };
  }
  desde(p) {
    var f = {}; p = p || {};
    CAMPOS.forEach(function (k) { f[k] = p[k] || ''; });
    if (!f.profesion) f.profesion = 'Fisioterapeuta';
    if (!f.tipo_documento) f.tipo_documento = 'CC';
    return f;
  }
  alMostrar() {
    var self = this, hoy = APP.f.hoy();
    this.setState({ f: this.desde(APP.perfil), foto: APP.perfil.foto || '', estado: '', firmaCambio: false });
    APP.db.usuario().then(function (u) { self.setState({ cuenta: (u && u.email) || '' }); });
    APP.db.ajuste('firma_profesional').then(function (url) {
      self.setState({ firmaGuardada: !!url });
      setTimeout(function () {
        var l = APP.lienzo('firmaPerfil'); if (!l) return;
        l.alCambiar = function () { self.setState({ firmaCambio: true }); };
        if (url) l.cargar(url); else l.reiniciar();
      }, 0);
    }).catch(function () {});
    Promise.all([APP.db.rpc('mi_uso', { desde: hoy.slice(0, 8) + '01', hasta: hoy }), APP.cobro.tarifas()]).then(function (r) {
      var u = (r[0] || [])[0]; if (!u) return;
      var fin = APP.f.iso(new Date(+hoy.slice(0, 4), +hoy.slice(5, 7), 0)), c = APP.cobro.cobro(u, r[1], fin);
      self.setState({ plan: { nombre: APP.cobro.nombrePlan(u.plan), valor: APP.cobro.cop(c.valor), detalle: c.detalle } });
    }).catch(function () {});
  }
  aviso(t, error) { this.setState({ estado: t, error: !!error }); }
  set(k, v) { var f = Object.assign({}, this.state.f); f[k] = v; this.setState({ f: f, estado: '' }); }
  elegirFoto(ev) {
    var self = this, a = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!a) return;
    APP.u.redimensionar(a, 360, 0.85).then(function (blob) {
      var r = new FileReader();
      r.onload = function () { self.setState({ foto: r.result, estado: 'Foto lista. Pulsa "Guardar perfil" para conservarla.', error: false }); };
      r.readAsDataURL(blob);
    }).catch(function (e) { self.aviso(e.message, true); });
  }
  guardar(ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    var self = this, f = this.state.f, p = {};
    CAMPOS.forEach(function (k) { p[k] = String(f[k] || '').trim(); });
    if (!p.nombre) { this.aviso('Escribe tu nombre completo: aparece en los consentimientos y documentos.', true); return; }
    if (!p.tarjeta) { this.aviso('Escribe el número de tu tarjeta profesional: es obligatorio en los consentimientos.', true); return; }
    if (p.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.correo)) { this.aviso('Revisa el correo de contacto.', true); return; }
    p.foto = this.state.foto || '';
    this.setState({ ocupado: true });
    var l = APP.lienzo('firmaPerfil');
    var firma = l && this.state.firmaCambio ? (l.vacio ? APP.db.guardarAjuste('firma_profesional', null) : APP.db.guardarAjuste('firma_profesional', l.png())) : Promise.resolve();
    Promise.all([APP.db.guardarAjuste('perfil', p), firma]).then(function () {
      self.setState({ ocupado: false, firmaCambio: false, firmaGuardada: l ? !l.vacio : self.state.firmaGuardada });
      APP.actualizarPerfil(p);
      self.aviso('Perfil guardado. Tus datos ya aparecen en los consentimientos y documentos.');
    }).catch(function (e) { self.setState({ ocupado: false }); self.aviso('No se pudo guardar: ' + APP.mensajeError(e), true); });
  }
  aceptarPolitica() {
    var self = this;
    if (!APP.p.completo()) { this.aviso('Primero guarda tu nombre y tu tarjeta profesional: la política se completa con esos datos.', true); return; }
    if (!this.state.verPolitica) { this.setState({ verPolitica: true }); this.aviso('Lee la política y vuelve a pulsar "Leí y acepto la política".', false); return; }
    var reg = { version: APP.politica.version, aceptada_en: new Date().toISOString(), nombre: APP.p.nombre(), tarjeta: APP.p.tarjeta() };
    this.setState({ ocupado: true });
    APP.db.guardarAjuste('politica_datos', reg).then(function () {
      APP.politicaAceptada = reg;
      self.setState({ ocupado: false }); self.aviso('Política aceptada. Ya puedes firmar consentimientos.');
    }).catch(function (e) { self.setState({ ocupado: false }); self.aviso(APP.mensajeError(e), true); });
  }
  exportar() {
    var self = this;
    this.setState({ exportando: true });
    Promise.all(TABLAS.map(function (t) { return APP.db.listar(t).catch(function () { return []; }); })).then(function (r) {
      var datos = { generado: new Date().toISOString(), software: 'YoFisio', cuenta: self.state.cuenta, perfil: APP.perfil };
      TABLAS.forEach(function (t, i) { datos[t] = r[i]; });
      var blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'yofisio-copia-' + APP.f.hoy() + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      self.setState({ exportando: false }); self.aviso('Copia descargada.');
    }).catch(function (e) { self.setState({ exportando: false }); self.aviso(APP.mensajeError(e), true); });
  }
  renderVals() {
    var self = this, s = this.state, f = s.f, set = {};
    CAMPOS.forEach(function (k) { set[k] = function (ev) { self.set(k, ev.target.value); }; });
    var ids = [f.tarjeta ? 'TP ' + f.tarjeta.replace(/^tp\s*/i, '') : '', f.documento ? f.tipo_documento + ' ' + f.documento : ''].filter(Boolean).join(' · ');
    var ini = (f.nombre || 'Mi perfil').split(/\s+/).filter(Boolean).map(function (x) { return x[0]; }).join('').slice(0, 2).toUpperCase();
    return {
      f: f, set: set, tiposDoc: TIPOS_DOC.map(function (t) { return { k: t }; }),
      hayFoto: !!s.foto, sinFoto: !s.foto, foto: s.foto, ini: ini,
      elegirFoto: function (ev) { self.elegirFoto(ev); },
      quitarFoto: function () { self.setState({ foto: '', estado: 'Pulsa "Guardar perfil" para confirmar.', error: false }); },
      previaNombre: f.nombre || 'Tu nombre completo', previaProfesion: f.profesion || 'Fisioterapeuta', previaIds: ids || 'TP ______',
      previaContacto: [f.celular ? 'WhatsApp ' + f.celular : '', f.correo, f.ciudad].filter(Boolean).join(' · ') || 'Tus datos de contacto',
      limpiarFirma: function () { var l = APP.lienzo('firmaPerfil'); if (l) { l.limpiar(); self.setState({ firmaCambio: true }); } },
      deshacerFirma: function () { var l = APP.lienzo('firmaPerfil'); if (l) l.deshacer(); },
      textoFirma: s.firmaGuardada ? 'Esta firma se carga sola en cada consentimiento. Puedes cambiarla aquí.' : 'Dibuja tu firma una vez y se cargará sola en cada consentimiento.',
      guardar: function (ev) { self.guardar(ev); }, ocupado: s.ocupado,
      hayEstado: !!s.estado, estado: s.estado, estadoColor: s.error ? '#991B1B' : '#065F46',
      cuenta: s.cuenta || '—',
      hayPlan: !!s.plan, plan: s.plan || {},
      exportar: function () { self.exportar(); }, exportando: s.exportando,
      polEstado: APP.politica.aceptada() ? 'Aceptada el ' + APP.f.corta(APP.f.local(APP.politicaAceptada.aceptada_en)) + ' ' + String(APP.politicaAceptada.aceptada_en).slice(0, 4) : 'Pendiente',
      polBg: APP.politica.aceptada() ? '#D1FAE5' : '#FFEDD5', polFg: APP.politica.aceptada() ? '#065F46' : '#9A3412',
      verPolitica: s.verPolitica, politicaTexto: APP.politica.texto(),
      textoVer: s.verPolitica ? 'Ocultar política' : 'Leer política',
      togglePolitica: function () { self.setState({ verPolitica: !self.state.verPolitica }); },
      imprimirPolitica: function () { APP.u.imprimir('Política de tratamiento de datos personales', '<pre style="font-size:10.5pt">' + APP.u.esc(APP.politica.texto()) + '</pre>'); },
      puedeAceptar: !APP.politica.aceptada(), aceptarPolitica: function () { self.aceptarPolitica(); },
      hayAvisoPol: !APP.p.completo() && !APP.politica.aceptada(), avisoPol: 'Para aceptarla, primero guarda tu nombre y tu tarjeta profesional.',
      textoExportar: s.exportando ? 'Preparando…' : 'Descargar copia de mis datos'
    };
  }
}
</script>

<main style="flex: 1 1 560px; min-width: 0; padding: 28px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; max-width: 1180px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 640px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Administración</h1>
<span style="font-size: 15px; color: #475569">Uso de la aplicación por profesional. Solo se muestran cantidades: los nombres y datos clínicos de los pacientes no son visibles aquí.</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" onClick="{{abrirNueva}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: #047857; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer">+ Nueva profesional</button>
<button type="button" onClick="{{abrirTarifas}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer">Tarifas</button>
<button type="button" onClick="{{exportar}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: #1D4ED8; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer">Exportar CSV</button>
</div>
</header>

<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{anterior}}" aria-label="Mes anterior" style="width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-size: 20px; font-weight: 800; cursor: pointer">‹</button>
<div style="display: flex; flex-direction: column; min-width: 170px"><b style="font-size: 20px">{{titulo}}</b><span style="font-size: 13px; color: #64748B">{{periodo}}</span></div>
<button type="button" onClick="{{siguiente}}" disabled="{{sinSiguiente}}" aria-label="Mes siguiente" style="width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid #C8D9EF; background: #FFFFFF; color: #0F2A4A; font-size: 20px; font-weight: 800; cursor: pointer">›</button>
<template data-sc="if" value="{{cargando}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 14px; color: #64748B">Cargando…</span></template>
</div>

<template data-sc="if" value="{{hayError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #FDECEC; color: #9B1C1C; font-size: 15px; font-weight: 700">{{error}}</p></template>

<section aria-label="Resumen del mes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: #475569"><span style="width: 10px; height: 10px; border-radius: 4px; background: {{t.c}}"></span>{{t.t}}</span>
<b style="font-size: 26px; font-weight: 800; color: #0F2A4A">{{t.v}}</b>
<span style="font-size: 12.5px; color: #64748B">{{t.d}}</span>
</div>
</template>
</section>

<p style="margin: 0; font-size: 13px; color: #64748B">Tarifas vigentes: {{tarifasTxt}}</p>

<section aria-label="Profesionales" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px">
<template data-sc="for" list="{{tarjetas}}" as="p" hint-placeholder-count="2">
<article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; flex: none; border-radius: 16px; background: #E2E8F0; color: #334155; display: flex; align-items: center; justify-content: center; font-weight: 800">{{p.ini}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800; overflow-wrap: anywhere">{{p.nombre}}</h2>
<span style="font-size: 13px; color: #64748B; overflow-wrap: anywhere">{{p.email}}</span>
</div>
<span style="padding: 5px 10px; border-radius: 999px; background: {{p.estBg}}; color: {{p.estFg}}; font-size: 12px; font-weight: 800">{{p.estado}}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px">
<template data-sc="for" list="{{p.stats}}" as="x" hint-placeholder-count="8">
<div style="background: #F8FAFC; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<b style="font-size: 17px; font-weight: 800; overflow-wrap: anywhere">{{x.v}}</b><span style="font-size: 11.5px; color: #64748B; line-height: 1.2">{{x.t}}</span>
</div>
</template>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 800; color: #475569">Sesiones por mes</span>
<div role="img" aria-label="Sesiones registradas en los últimos seis meses" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 96px; border-bottom: 1px solid #E2E8F0">
<template data-sc="for" list="{{p.barras}}" as="b" hint-placeholder-count="6">
<div title="{{b.titulo}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%">
<span style="font-size: 12px; font-weight: {{b.peso}}; color: #334155">{{b.n}}</span>
<div style="width: 60%; max-width: 30px; height: {{b.alto}}; background: {{b.color}}; border-radius: 4px 4px 0 0"></div>
</div>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<template data-sc="for" list="{{p.barras}}" as="b" hint-placeholder-count="6"><span style="text-align: center; font-size: 11.5px; color: #64748B; font-weight: {{b.peso}}">{{b.mes}}</span></template>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">

function mesTexto(m) { return APP.f.cap(APP.f.mes(m + '-01')) + ' ' + m.slice(0, 4); }
function fecha(t) { return t ? APP.f.corta(APP.f.local(t)) + ' ' + String(APP.f.local(t)).slice(0, 4) : '—'; }

class Component extends DCLogic {
  constructor(props) {

    this.state = { mes: h.slice(0, 7), cargando: true, error: '', usuarios: [], mensual: [], capacidad: null,

<script>
/* Capa de datos: Supabase si config.js tiene URL y clave; si no, modo demostración local. */

    { nombre: 'Sueroterapia', categoria: 'servicio', icono: 'iSuero', orden: 4 },
    { nombre: 'Rehabilitación ortopédica', categoria: 'area', icono: 'iOrto', orden: 5 },
    { nombre: 'Rehabilitación deportiva', categoria: 'area', icono: 'iDep', orden: 6 },
    { nombre: 'Acondicionamiento físico', categoria: 'area', icono: 'iAcond', orden: 7 }
  ];

  // ---------- utilidades de fecha (hora local) ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

    lunes: function (s) { var d = deIso(s); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); },

  function uid() {

  }

  var DB;
  if (remoto) {
    if (!window.supabase) {
      DB = { error: 'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.' };
    } else {
      var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      var consulta = function (tabla, f) {
        f = f || {};
        var q = sb.from(tabla).select('*');
        (f.eq || []).forEach(function (e) { q = q.eq(e[0], e[1]); });
        if (f.gte) q = q.gte(f.gte[0], f.gte[1]);
        if (f.lte) q = q.lte(f.lte[0], f.lte[1]);

            if (r.error) throw new Error(/different|same/i.test(r.error.message) ? 'La nueva contraseña debe ser distinta de la actual.' : r.error.message);

        listar: function (t, f) { return consulta(t, f).then(ok); },

        actualizar: function (t, id, cambios) { return sb.from(t).update(cambios).eq('id', id).select().single().then(ok); },
        borrar: function (t, id) { return sb.from(t).delete().eq('id', id).then(ok); },
        subir: function (blob, ext) {
          return sb.auth.getSession().then(function (r) {
            var u = r.data.session && r.data.session.user;
            if (!u) throw new Error('La sesión expiró. Vuelve a ingresar.');
            var ruta = u.id + '/' + Date.now() + '-' + Math.random().toString(16).slice(2, 8) + '.' + ext;
            return sb.storage.from('evidencias').upload(ruta, blob, { contentType: blob.type, upsert: false })
              .then(function (x) { if (x.error) throw new Error(x.error.message); return ruta; });
          });
        },
        funcion: function (nombre, cuerpo) {
          return sb.functions.invoke(nombre, { body: cuerpo }).then(function (r) {
            if (!r.error) return r.data;
            var ctx = r.error.context;
            var leer = ctx && typeof ctx.json === 'function' ? ctx.json().catch(function () { return null; }) : Promise.resolve(null);
            return leer.then(function (j) {

    var ins = instancia(actual);
    var activo = document.activeElement, id = activo && activo.id, ini = null, fin = null;
    try { if (id) { ini = activo.selectionStart; fin = activo.selectionEnd; } } catch (e) {}
    var cajas = [].map.call(root.querySelectorAll('[data-scroll-id]'), function (x) { return [x.getAttribute('data-scroll-id'), x.scrollLeft, x.scrollTop]; });
    var vals;
    try { vals = ins.comp.renderVals(); } catch (e) { console.error(e); return; }
    var previa = root.getAttribute('data-pantalla') || actual;
    root.querySelectorAll('[data-keep]').forEach(function (n) { guardados[previa + ':' + n.getAttribute('data-keep')] = n; });
    var frag = document.createDocumentFragment();
    var hijos = ins.tpl.content.childNodes;
    for (var i = 0; i < hijos.length; i++) render(hijos[i], vals, frag);
    frag.querySelectorAll('[data-keep]').forEach(function (n) {
      var viejo = guardados[actual + ':' + n.getAttribute('data-keep')];
      if (viejo && viejo !== n) n.replaceWith(viejo);
    });
    root.replaceChildren(frag);
    root.setAttribute('data-pantalla', actual);
    aplicarPerfil();
    root.querySelectorAll('canvas[data-lienzo]').forEach(iniciarLienzo);
    cajas.forEach(function (c) { var x = root.querySelector('[data-scroll-id="' + c[0] + '"]'); if (x) { x.scrollLeft = c[1]; x.scrollTop = c[2]; } });
    if (id) {
      var nuevo = document.getElementById(id);
      if (nuevo) { nuevo.focus(); try { if (ini !== null) nuevo.setSelectionRange(ini, fin); } catch (e) {} }
    }
  }

  // Nombre, profesión y foto de la profesional en el menú.
  function aplicarPerfil() {
    var P = APP.p;
    root.querySelectorAll('[data-perfil="nombre"]').forEach(function (n) { n.textContent = P.nombre() || 'Mi consultorio'; });
    root.querySelectorAll('[data-perfil="profesion"]').forEach(function (n) { n.textContent = P.profesion().toUpperCase(); });
    root.querySelectorAll('.menu-marca').forEach(function (m) {
      var img = m.querySelector('img[data-perfil="foto"]'), svg = m.querySelector('svg');
      if (!img) return;
      if (APP.perfil.foto) { img.src = APP.perfil.foto; img.hidden = false; if (svg) svg.style.display = 'none'; }
      else { img.hidden = true; if (svg) svg.style.display = ''; }
    });
  }
  APP.actualizarPerfil = function (p) { APP.perfil = p || {}; pintar(); };

  function parametros(q) {
    var o = {};
    (q || '').split('&').forEach(function (par) {
      if (!par) return;
      var kv = par.split('=');
      o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return o;
  }

  function ir() {
    var h = location.hash.replace(/^#/, '');
    var partes = h.split('?');
    var nombre = conSesion ? (PANTALLAS.indexOf(partes[0]) >= 0 ? partes[0] : 'Main') : 'Login';
    if (conSesion && esAdmin) nombre = 'Administracion';
    else if (conSesion && nombre === 'Administracion') nombre = 'Main';
    actual = nombre;
    var nodo = document.getElementById('tpl-' + nombre);
    document.title = nodo.getAttribute('data-title') || document.title;
    var ins = instancia(nombre);
    if (ins.comp.alMostrar) ins.comp.alMostrar(parametros(partes[1]));
    pintar();
    window.scrollTo(0, 0);
  }

  function comprobarSesion() {
    var usuario = null;
    return APP.db.usuario().then(function (u) {
      conSesion = !!u; usuario = u;
      return u ? APP.db.esAdmin() : false;
    }).then(function (si) {
      esAdmin = !!si;
      APP.perfil = {}; APP.politicaAceptada = null;
      if (!conSesion || esAdmin) return;
      return Promise.all([APP.db.ajuste('perfil'), APP.db.ajuste('politica_datos')])
        .then(function (r) { APP.perfil = r[0] || {}; APP.politicaAceptada = r[1] || null; }).catch(function () {});
    }).then(function () {
      document.body.classList.toggle('es-admin', esAdmin);
      ir();
      // Cuenta creada por el administrador con contraseña temporal: debe cambiarla al primer ingreso.
      if (usuario && usuario.user_metadata && usuario.user_metadata.debe_cambiar_clave && !APP.db.demo) dialogoClave(true);
    }).catch(function (e) { if (window.console) console.error(e); conSesion = false; esAdmin = false; document.body.classList.remove('es-admin'); ir(); });
  }
  APP.irA = function (hash) { if (location.hash === hash) ir(); else location.hash = hash; };
  APP.sesionIniciada = comprobarSesion;


  function dialogoClave(obligatorio) {
    if (APP.db.demo) { window.alert('En modo demostración no hay contraseña que cambiar.'); return; }
    if (document.getElementById('c-n1')) return;
    var capa = document.createElement('div');
    capa.style.cssText = 'position:fixed;inset:0;background:rgba(15,42,74,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;font-family:Nunito,system-ui,sans-serif;color:#0F2A4A';
    var campo = 'min-height:48px;padding:0 14px;border:1.5px solid #C8D9EF;border-radius:12px;font:inherit;font-size:15px;color:#0F2A4A';
    capa.innerHTML = '<form aria-labelledby="t-clave" style="width:420px;max-width:100%;background:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px">'
      + '<h2 id="t-clave" style="margin:0;font-size:22px;font-weight:800">' + (obligatorio ? 'Crea tu contraseña' : 'Cambiar contraseña') + '</h2>'
      + (obligatorio ? '<p style="margin:0;font-size:15px;color:#475569">Ingresaste con una contraseña temporal. Por seguridad, crea ahora una contraseña propia que solo tú conozcas.</p>' : '')
      + '<label for="c-n1" style="font-size:14px;font-weight:700">Nueva contraseña (mínimo 8 caracteres)</label><input id="c-n1" type="password" autocomplete="new-password" style="' + campo + '">'
      + '<label for="c-n2" style="font-size:14px;font-weight:700">Repite la nueva contraseña</label><input id="c-n2" type="password" autocomplete="new-password" style="' + campo + '">'
      + '<p role="alert" id="c-msg" style="margin:0;font-size:14px;font-weight:700;color:#9B1C1C"></p>'
      + '<div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" id="c-cancel" style="min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #C8D9EF;background:#fff;color:#0F2A4A;font:inherit;font-weight:700;cursor:pointer">Cancelar</button>'
      + '<button type="submit" id="c-ok" style="min-height:48px;padding:0 24px;border-radius:999px;border:0;background:#1D6FE0;color:#fff;font:inherit;font-weight:800;cursor:pointer">Guardar</button></div></form>';
    document.body.appendChild(capa);
    var form = capa.querySelector('form'), msg = capa.querySelector('#c-msg'), ok = capa.querySelector('#c-ok');
    function cerrar() { capa.remove(); }
    if (obligatorio) capa.querySelector('#c-cancel').remove(); else capa.querySelector('#c-cancel').addEventListener('click', cerrar);
    capa.querySelector('#c-n1').focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var a = capa.querySelector('#c-n1').value, b = capa.querySelector('#c-n2').value;
      msg.style.color = '#9B1C1C';
      if (a.length < 8) { msg.textContent = 'Usa al menos 8 caracteres.'; return; }
      if (a !== b) { msg.textContent = 'Las dos contraseñas no coinciden.'; return; }
      ok.disabled = true; msg.textContent = '';
      APP.db.cambiarClave(a).then(function () {
        msg.style.color = '#064E3B'; msg.textContent = 'Contraseña actualizada.';
        setTimeout(cerrar, 1400);
      }).catch(function (err) { ok.disabled = false; msg.textContent = err.message; });
    });
  }

  document.addEventListener('click', function (e) {
    var cl = e.target.closest && e.target.closest('[data-action="clave"]');
    if (cl) dialogoClave();
    var a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
    var salir = e.target.closest && e.target.closest('[data-action="salir"]');
    if (salir) {
      var msg = APP.db.demo ? '¿Salir y borrar los datos de demostración?' : '¿Cerrar sesión?';
      if (window.confirm(msg)) APP.db.salir().then(function () { instancias = {}; comprobarSesion(); });
    }
  });
  window.addEventListener('hashchange', ir);

  // ---------- Instalar la aplicación ----------
  var promptInstalar = null;
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function instalada() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }
  function marcarInstalable(si) {
    document.body.classList.toggle('puede-instalar', !!si && !instalada());
    var oculto = false;
    try { oculto = localStorage.getItem('fisio-aviso-instalar') === 'no'; } catch (e) {}
    document.body.classList.toggle('mostrar-aviso', !!si && !oculto);
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); promptInstalar = e; marcarInstalable(true);
  });
  window.addEventListener('appinstalled', function () {
    promptInstalar = null; marcarInstalable(false);
  });
  if (esIOS && !instalada()) marcarInstalable(true);

  var aviso = document.createElement('div');
  aviso.className = 'aviso-instalar';
  aviso.setAttribute('role', 'region');
  aviso.setAttribute('aria-label', 'Instalar la aplicación');
  aviso.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M12 7v7M9 11l3 3 3-3"></path></svg>'
    + '<p>Instala la app en este dispositivo.</p>'
    + '<button type="button" class="si" data-action="instalar">Instalar</button>'
    + '<button type="button" class="no" aria-label="Ocultar este aviso">×</button>';
  document.body.appendChild(aviso);
  aviso.querySelector('.no').addEventListener('click', function () {
    try { localStorage.setItem('fisio-aviso-instalar', 'no'); } catch (e) {}
    document.body.classList.remove('mostrar-aviso');
  });

  function pasosInstalar() {
    var capa = document.createElement('div');
    capa.style.cssText = 'position:fixed;inset:0;background:rgba(15,42,74,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;font-family:Nunito,system-ui,sans-serif;color:#0F2A4A';
    var pasos = esIOS
      ? '<li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.</li>'
      : '<li>Abre el menú del navegador (los tres puntos ⋮).</li><li>Elige <b>Instalar aplicación</b> o <b>Agregar a pantalla principal</b>.</li><li>Confirma con <b>Instalar</b>.</li>';
    capa.innerHTML = '<div role="dialog" aria-labelledby="t-inst" style="width:420px;max-width:100%;background:#fff;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px">'
      + '<h2 id="t-inst" style="margin:0;font-size:21px;font-weight:800">Instalar la app</h2>'
      + '<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45">' + pasos + '</ol>'
      + '<button type="button" style="align-self:flex-end;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:#1D4ED8;color:#fff;font:inherit;font-weight:800;cursor:pointer">Entendido</button></div>';
    document.body.appendChild(capa);
    var btn = capa.querySelector('button'); btn.focus();
    btn.addEventListener('click', function () { capa.remove(); });
    capa.addEventListener('click', function (e) { if (e.target === capa) capa.remove(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-action="instalar"]');
    if (!b) return;
    if (promptInstalar) {
      var p = promptInstalar; promptInstalar = null;
      p.prompt();
      p.userChoice.then(function (r) { if (r.outcome === 'accepted') marcarInstalable(false); }).catch(function () {});
    } else {
      pasosInstalar();
    }
  });

  if (APP.db.error) {
    root.innerHTML = '<p style="font-family:system-ui;padding:40px;color:#991B1B">' + APP.db.error + '</p>';
    return;
  }
  if (APP.db.demo) {
    var b = document.createElement('div');
    b.textContent = 'Modo demostración: datos ficticios guardados solo en este navegador. Configura Supabase en config.js para usar datos reales.';
    b.setAttribute('role', 'status');
    b.style.cssText = 'font-family:Nunito,system-ui,sans-serif;background:#FFF4C7;color:#713F12;font-size:14px;font-weight:700;padding:10px 20px;text-align:center';
    document.body.insertBefore(b, root);
    document.body.classList.add('demo');
  }
  // Supabase avisa de nuevo la sesión al volver a la pestaña o al renovar el token:
  // solo se reinicia la aplicación si de verdad se entró o se salió.
  APP.db.alCambiarSesion(function () {
    APP.db.usuario().then(function (u) {
      if (!!u !== conSesion) { instancias = {}; comprobarSesion(); }
    });
  });
  comprobarSesion();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
