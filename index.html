var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = this.vacio(); }
  vacio() { return { cargando: true, error: '', paciente: null, sesiones: [], historias: [], consentimientos: [], urls: {}, filtro: 'todo' }; }
  alMostrar(params) {
    var self = this, pid = params && params.p;
    this.setState(this.vacio());
    if (!pid) { this.setState({ cargando: false, error: 'Abre la evolución desde la tarjeta del paciente.' }); return; }
    Promise.all([
      APP.db.listar('pacientes', { eq: [['id', pid]] }),
      APP.db.listar('sesiones', { eq: [['paciente_id', pid]], order: ['fecha', false] }),
      APP.db.listar('historias', { eq: [['paciente_id', pid]], order: ['created_at', false] }),
      APP.db.listar('consentimientos', { eq: [['paciente_id', pid]] }).catch(function () { return []; })
    ]).then(function (r) {
      self.setState({ cargando: false, paciente: r[0][0] || null, sesiones: r[1], historias: r[2], consentimientos: r[3] });
      self.cargarImagenes(r[1].slice(0, 30));
    }).catch(function (e) { self.setState({ cargando: false, error: APP.mensajeError(e) }); });
  }
  cargarImagenes(sesiones) {
    var self = this, rutas = [];
    sesiones.forEach(function (x) {
      if (x.dibujo) rutas.push(x.dibujo);
      (Array.isArray(x.fotos) ? x.fotos : []).forEach(function (f) { rutas.push(f); });
    });
    rutas.forEach(function (r) {
      APP.db.url(r).then(function (u) {
        var m = Object.assign({}, self.state.urls); m[r] = u; self.setState({ urls: m });
      }).catch(function () {});
    });
  }
  eventos() {
    var s = this.state, F = APP.f, lista = [];
    var orden = s.sesiones.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
    var numero = {};
    orden.forEach(function (x, i) { numero[x.id] = i + 1; });
    if (s.filtro === 'todo' || s.filtro === 'sesiones') s.sesiones.forEach(function (x) {
      var imgs = [];
      if (x.dibujo && s.urls[x.dibujo]) imgs.push({ url: s.urls[x.dibujo], alt: 'Dibujo de la sesión' });
      (Array.isArray(x.fotos) ? x.fotos : []).forEach(function (f, i) { if (s.urls[f]) imgs.push({ url: s.urls[f], alt: 'Foto de evidencia ' + (i + 1) }); });
      lista.push({ fecha: x.fecha, tipo: 'sesion', titulo: 'Sesión ' + numero[x.id] + (s.paciente && s.paciente.plan_sesiones ? ' de ' + s.paciente.plan_sesiones : ''),
        etiqueta: x.servicio || 'Sesión', bg: '#DBEAFE', fg: '#1E3A8A', tituloResumen: 'Lo que se realizó',
        resumen: x.resumen || '', notas: x.notas || '', ejercicios: x.ejercicios || '', imagenes: imgs,
        enlace: 'Sesion.dc.html?s=' + x.id, textoEnlace: 'Abrir sesión completa', orden: x.created_at || x.fecha });
    });
    if (s.filtro === 'todo' || s.filtro === 'valoraciones') s.historias.forEach(function (h) {
      var fecha = F.local(h.created_at);
      lista.push({ fecha: fecha, tipo: 'valoracion', titulo: 'Valoración y cuestionario detox', etiqueta: 'Detox ' + (h.nivel || '—') + ' · ' + (h.puntaje_global || 0) + ' pts',
        bg: '#EDE9FE', fg: '#5B21B6', tituloResumen: 'Motivo de consulta', resumen: h.motivo || '', notas: '', ejercicios: '', imagenes: [],
        enlace: 'HistoriaClinica.dc.html?p=' + h.paciente_id, textoEnlace: 'Abrir historia clínica', orden: h.created_at || fecha });
    });
    if (s.filtro === 'todo' || s.filtro === 'consentimientos') s.consentimientos.forEach(function (c) {
      var fecha = F.local(c.firmado_en);
      lista.push({ fecha: fecha, tipo: 'consentimiento', titulo: 'Consentimiento firmado', etiqueta: (c.servicios && c.servicios[0]) || 'Consentimiento',
        bg: '#D1FAE5', fg: '#065F46', tituloResumen: 'Firma', resumen: 'Firmó ' + c.firmante_nombre + (c.firmante_relacion === 'acudiente' ? ' (responsable)' : ''), notas: '', ejercicios: '', imagenes: [],
        enlace: 'Consentimiento.dc.html?p=' + c.paciente_id, textoEnlace: 'Ver o imprimir', orden: c.firmado_en || fecha });
    });
    lista.sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.orden < b.orden ? 1 : -1); });
    return lista;
  }
  imprimir() {
    var s = this.state, u = APP.u, F = APP.f, e = u.esc, p = s.paciente || {};
    var ses = s.sesiones.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
    var cuerpo = '<h2>Paciente</h2><div class="grid"><div><span class="k">Nombre:</span> ' + e(p.nombre) + '</div><div><span class="k">Cédula:</span> ' + e(p.cc || '—') + '</div>'
      + '<div><span class="k">Sesiones realizadas:</span> ' + ses.length + (p.plan_sesiones ? ' de ' + p.plan_sesiones : '') + '</div><div><span class="k">Celular:</span> ' + e(p.celular || '—') + '</div></div>'
      + '<h2>Registro de evolución</h2>'
      + (ses.length ? '<table><tr><th style="width:90px">Fecha</th><th style="width:130px">Terapia</th><th>Evolución</th></tr>' + ses.map(function (x, i) {
        var t = '';
        if (x.resumen) t += '<b>Realizado:</b> ' + e(x.resumen) + '<br>';
        if (x.notas) t += '<b>Notas clínicas:</b> ' + e(x.notas) + '<br>';
        if (x.ejercicios) t += '<b>Ejercicios para casa:</b> ' + e(x.ejercicios) + '<br>';
        var n = (Array.isArray(x.fotos) ? x.fotos.length : 0);
        if (n || x.dibujo) t += '<span class="k">' + (x.dibujo ? 'Con dibujo. ' : '') + (n ? n + ' foto(s) de evidencia.' : '') + '</span>';
        return '<tr><td>' + (i + 1) + '. ' + e(x.fecha) + '</td><td>' + e(x.servicio || '—') + '</td><td>' + (t || '—') + '</td></tr>';
      }).join('') + '</table>' : '<p>No hay sesiones registradas.</p>')
      + (s.historias.length ? '<h2>Valoraciones</h2>' + s.historias.map(function (h) {
        return '<p>' + e(F.local(h.created_at)) + ': cuestionario detox ' + e(h.nivel || '—') + ' (' + (h.puntaje_global || 0) + ' pts).</p>';
      }).join('') : '')
      + '<div class="firma"><div><div class="linea"></div><b>Angie Lorena Ferrucho</b><br>Fisioterapeuta</div></div>'
      + '<p class="nota">Documento generado el ' + e(new Date().toLocaleString('es-CO')) + '.</p>';
    u.imprimir('Evolución – ' + (p.nombre || 'Paciente'), cuerpo);
  }
  renderVals() {
    var self = this, s = this.state, F = APP.f, p = s.paciente;
    var ev = this.eventos();
    var ult = s.sesiones[0], hc = s.historias[0];
    var opciones = [{ k: 'todo', l: 'Todo' }, { k: 'sesiones', l: 'Sesiones (' + s.sesiones.length + ')' }, { k: 'valoraciones', l: 'Valoraciones (' + s.historias.length + ')' }, { k: 'consentimientos', l: 'Consentimientos (' + s.consentimientos.length + ')' }];
    return {
      subtitulo: s.error || (p ? p.nombre + (p.cc ? ' · CC ' + p.cc : '') : (s.cargando ? 'Cargando…' : 'Paciente no encontrado')),
      pid: p ? p.id : '',
      resumen: [
        { label: 'Sesiones realizadas', valor: s.sesiones.length + (p && p.plan_sesiones ? ' de ' + p.plan_sesiones : ''), color: '#1E3A8A' },
        { label: 'Última sesión', valor: ult ? F.cap(F.corta(ult.fecha)) : '—', color: '#0F2A4A' },
        { label: 'Última terapia', valor: ult ? (ult.servicio || '—') : '—', color: '#0F2A4A' },
        { label: 'Última valoración detox', valor: hc ? (hc.nivel || '—') + ' · ' + (hc.puntaje_global || 0) : '—', color: '#5B21B6' }
      ],
      filtros: opciones.map(function (o) {
        var on = s.filtro === o.k;
        return { label: o.l, on: on ? 'true' : 'false', bg: on ? '#1D4ED8' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F2A4A', borde: on ? '#1D4ED8' : '#CBD5E1',
          pick: function () { self.setState({ filtro: o.k }); } };
      }),
      eventos: ev.map(function (x) {
        var d = F.deIso(x.fecha);
        return Object.assign({}, x, { dia: d.getDate(), mes: MESES[d.getMonth()],
          hayResumen: !!x.resumen, hayNotas: !!x.notas, hayEjercicios: !!x.ejercicios, hayImagenes: x.imagenes.length > 0 });
      }),
      vacio: ev.length === 0,
      textoVacio: s.cargando ? 'Cargando…' : 'Todavía no hay registros. Empieza con "Registrar sesión".',
      imprimir: function () { self.imprimir(); }
    };
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* Capa de datos: Supabase si config.js tiene URL y clave; si no, modo demostración local. */
(function () {
  var APP = window.APP = window.APP || {};
  var cfg = window.FISIO_CONFIG || {};
  if (cfg.supabaseUrl) cfg.supabaseUrl = String(cfg.supabaseUrl).trim().replace(/\/(rest|auth)\/v1\/?.*$/, '').replace(/\/+$/, '');
  var remoto = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);

  var SERVICIOS_INICIALES = [
    { nombre: 'Punción seca', categoria: 'servicio', icono: 'iPuncion', orden: 1 },
    { nombre: 'Electropunción', categoria: 'servicio', icono: 'iElectro', orden: 2 },
    { nombre: 'Terapia neural', categoria: 'servicio', icono: 'iNeural', orden: 3 },
    { nombre: 'Sueroterapia', categoria: 'servicio', icono: 'iSuero', orden: 4 },
    { nombre: 'Rehabilitación ortopédica', categoria: 'area', icono: 'iOrto', orden: 5 },
    { nombre: 'Rehabilitación deportiva', categoria: 'area', icono: 'iDep', orden: 6 },
    { nombre: 'Acondicionamiento físico', categoria: 'area', icono: 'iAcond', orden: 7 }
  ];

  // ---------- utilidades de fecha (hora local) ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function deIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  APP.f = {
    iso: iso, deIso: deIso, hoy: function () { return iso(new Date()); },
    local: function (marca) { if (!marca) return iso(new Date()); var d = new Date(marca); return isNaN(d) ? String(marca).slice(0, 10) : iso(d); },
    sumar: function (s, n) { var d = deIso(s); d.setDate(d.getDate() + n); return iso(d); },
    lunes: function (s) { var d = deIso(s); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); },
    larga: function (s) { var d = deIso(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; },
    corta: function (s) { var d = deIso(s); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); },
    mes: function (s) { return MESES[deIso(s).getMonth()]; },
    diaSemana: function (s) { return DIAS[deIso(s).getDay()]; },
    hora: function (h) { return h + ':00'; },
    cap: function (t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  };

  function uid() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  var DB;
  if (remoto) {
    if (!window.supabase) {
      DB = { error: 'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.' };
    } else {
      var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      var consulta = function (tabla, f) {
        f = f || {};
        var q = sb.from(tabla).select('*');
        (f.eq || []).forEach(function (e) { q = q.eq(e[0], e[1]); });
        if (f.gte) q = q.gte(f.gte[0], f.gte[1]);
        if (f.lte) q = q.lte(f.lte[0], f.lte[1]);
        if (f.order) q = q.order(f.order[0], { ascending: f.order[1] !== false });
        if (f.limit) q = q.limit(f.limit);
        return q;
      };
      var ok = function (r) { if (r.error) throw new Error(r.error.message); return r.data; };
      DB = {
        demo: false,
        usuario: function () { return sb.auth.getSession().then(function (r) { return r.data.session ? r.data.session.user : null; }); },
        entrar: function (email, clave) {
          return sb.auth.signInWithPassword({ email: email, password: clave }).then(function (r) {
            if (r.error) throw new Error('Correo o contraseña incorrectos.');
          });
        },
        salir: function () { return sb.auth.signOut(); },
        cambiarClave: function (nueva) {
          return sb.auth.updateUser({ password: nueva }).then(function (r) {
            if (r.error) throw new Error(/different|same/i.test(r.error.message) ? 'La nueva contraseña debe ser distinta de la actual.' : r.error.message);
          });
        },
        alCambiarSesion: function (cb) { sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') cb(); }); },
        listar: function (t, f) { return consulta(t, f).then(ok); },
        crear: function (t, fila) { return sb.from(t).insert(fila).select().single().then(ok); },
        actualizar: function (t, id, cambios) { return sb.from(t).update(cambios).eq('id', id).select().single().then(ok); },
        borrar: function (t, id) { return sb.from(t).delete().eq('id', id).then(ok); },
        subir: function (blob, ext) {
          return sb.auth.getSession().then(function (r) {
            var u = r.data.session && r.data.session.user;
            if (!u) throw new Error('La sesión expiró. Vuelve a ingresar.');
            var ruta = u.id + '/' + Date.now() + '-' + Math.random().toString(16).slice(2, 8) + '.' + ext;
            return sb.storage.from('evidencias').upload(ruta, blob, { contentType: blob.type, upsert: false })
              .then(function (x) { if (x.error) throw new Error(x.error.message); return ruta; });
          });
        },
        url: function (ruta) {
          return sb.storage.from('evidencias').createSignedUrl(ruta, 3600)
            .then(function (x) { if (x.error) throw new Error(x.error.message); return x.data.signedUrl; });
        }
      };
    }
  } else {
    // ---------- modo demostración: datos ficticios guardados en este navegador ----------
    var CLAVE = 'fisio-demo-v1';
    var leer = function () { try { return JSON.parse(localStorage.getItem(CLAVE)) || null; } catch (e) { return null; } };
    var datos = leer();
    if (!datos) {
      var hoy = iso(new Date()), lun = APP.f.lunes(hoy);
      var pA = uid(), pB = uid(), pC = uid(), pD = uid();
      datos = {
        pacientes: [
          { id: pA, nombre: 'Paciente A (demo)', celular: '', direccion: 'Dirección de ejemplo', plan_sesiones: 10, alta: false, fecha_nacimiento: '1986-10-08', estatura: 1.67, peso: 70, rh: 'O+' },
          { id: pB, nombre: 'Paciente B (demo)', celular: '', direccion: 'Dirección de ejemplo', plan_sesiones: 12, alta: false },
          { id: pC, nombre: 'Paciente C (demo)', celular: '', direccion: '', plan_sesiones: 8, alta: false },
          { id: pD, nombre: 'Paciente D (demo)', celular: '', direccion: '', plan_sesiones: 6, alta: true }
        ],
        citas: [
          { id: uid(), paciente_id: pA, paciente_nombre: 'Paciente A (demo)', fecha: hoy, hora: 8, tipo: 'domicilio', servicio: 'Punción seca', direccion: 'Dirección de ejemplo', recordatorio: true, estado: 'programada' },
          { id: uid(), paciente_id: pB, paciente_nombre: 'Paciente B (demo)', fecha: hoy, hora: 15, tipo: 'domicilio', servicio: 'Rehabilitación deportiva', direccion: 'Dirección de ejemplo', recordatorio: true, estado: 'programada' },
          { id: uid(), paciente_id: pC, paciente_nombre: 'Paciente C (demo)', fecha: APP.f.sumar(lun, 2), hora: 10, tipo: 'consultorio', servicio: 'Sueroterapia', direccion: '', recordatorio: true, estado: 'programada' },
          { id: uid(), paciente_id: null, paciente_nombre: 'Paciente nuevo (demo)', fecha: APP.f.sumar(lun, 4), hora: 9, tipo: 'valoracion', servicio: 'Valoración', direccion: '', recordatorio: true, estado: 'programada' }
        ],
        sesiones: [],
        historias: [],
        servicios: []
      };
      for (var i = 0; i < 8; i++) datos.sesiones.push({ id: uid(), paciente_id: pA, fecha: APP.f.sumar(hoy, -(i + 1) * 3), servicio: 'Punción seca', notas: '' });
      for (var j = 0; j < 4; j++) datos.sesiones.push({ id: uid(), paciente_id: pB, fecha: APP.f.sumar(hoy, -(j + 1) * 4), servicio: 'Rehabilitación deportiva', notas: '' });
      for (var k = 0; k < 6; k++) datos.sesiones.push({ id: uid(), paciente_id: pD, fecha: APP.f.sumar(hoy, -(k + 2) * 5), servicio: 'Terapia neural', notas: '' });
      datos.historias.push({ id: uid(), paciente_id: pA, created_at: new Date().toISOString(), motivo: 'Insomnio / mala calidad del sueño.\nBaja energía.\nRinitis y sinusitis frecuentes.',
        detox: { 'men-3': 4, 'men-2': 2, 'men-5': 1, 'men-6': 1, 'ong-5': 4, 'ong-2': 3, 'ong-1': 2, 'ong-7': 1, 'emo-0': 2, 'emo-5': 2, 'emo-1': 1, 'dig-4': 2, 'dig-1': 1, 'art-0': 2, 'met-0': 1, 'pie-5': 1 },
        objetivos: {}, puntaje_global: 30, nivel: 'MODERADO' });
    }
    var guardar = function () { try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch (e) {} };
    guardar();
    var copia = function (x) { return JSON.parse(JSON.stringify(x)); };
    var listarLocal = function (t, f) {
      f = f || {};
      var r = (datos[t] || []).filter(function (x) {
        return (f.eq || []).every(function (e) { return x[e[0]] === e[1]; })
          && (!f.gte || String(x[f.gte[0]]) >= String(f.gte[1]))
          && (!f.lte || String(x[f.lte[0]]) <= String(f.lte[1]));
      });
      if (f.order) {
        var c = f.order[0], asc = f.order[1] !== false;
        r.sort(function (a, b) { var va = a[c], vb = b[c]; return (va > vb ? 1 : va < vb ? -1 : 0) * (asc ? 1 : -1); });
      }
      if (f.limit) r = r.slice(0, f.limit);
      return copia(r);
    };
    DB = {
      demo: true,
      usuario: function () { return Promise.resolve({ email: 'demo' }); },
      entrar: function () { return Promise.resolve(); },
      cambiarClave: function () { return Promise.resolve(); },
      salir: function () { localStorage.removeItem(CLAVE); location.hash = ''; location.reload(); return Promise.resolve(); },
      alCambiarSesion: function () {},
      listar: function (t, f) { return Promise.resolve(listarLocal(t, f)); },
      crear: function (t, fila) {
        if (t === 'citas' && datos.citas.some(function (c) { return c.fecha === fila.fecha && c.hora === fila.hora; })) {
          return Promise.reject(new Error('duplicate key value violates unique constraint'));
        }
        var n = Object.assign({ id: uid(), created_at: new Date().toISOString() }, fila);
        (datos[t] = datos[t] || []).push(n); guardar(); return Promise.resolve(copia(n));
      },
      actualizar: function (t, id, cambios) {
        var x = (datos[t] || []).find(function (y) { return y.id === id; });
        if (!x) return Promise.reject(new Error('No encontrado'));
        Object.assign(x, cambios); guardar(); return Promise.resolve(copia(x));
      },
      borrar: function (t, id) {
        if (t === 'pacientes' && (datos.consentimientos || []).some(function (c) { return c.paciente_id === id; })) {
          return Promise.reject(new Error('violates foreign key constraint'));
        }
        datos[t] = (datos[t] || []).filter(function (y) { return y.id !== id; });
        if (t === 'pacientes') {
          ['sesiones', 'historias'].forEach(function (k) { datos[k] = datos[k].filter(function (y) { return y.paciente_id !== id; }); });
        }
        guardar(); return Promise.resolve();
      },
      subir: function (blob) {
        return new Promise(function (ok, ko) {
          var r = new FileReader();
          r.onload = function () {
            var ruta = 'demo/' + uid();
            datos.archivos = datos.archivos || {};
            datos.archivos[ruta] = r.result;
            try { localStorage.setItem(CLAVE, JSON.stringify(datos)); ok(ruta); }
            catch (e) { delete datos.archivos[ruta]; ko(new Error('El modo demostración no tiene más espacio para imágenes.')); }
          };
          r.onerror = function () { ko(new Error('No se pudo leer la imagen.')); };
          r.readAsDataURL(blob);
        });
      },
      url: function (ruta) { return Promise.resolve((datos.archivos || {})[ruta] || ''); }
    };
  }

  if (!DB.error) {
    // Crea el catálogo del volante la primera vez.
    DB.servicios = function () {
      return DB.listar('servicios', { order: ['orden'] }).then(function (lista) {
        if (lista.length) return lista;
        return Promise.all(SERVICIOS_INICIALES.map(function (s) { return DB.crear('servicios', s); }))
          .then(function () { return DB.listar('servicios', { order: ['orden'] }); });
      });
    };
    DB.ajuste = function (clave) {
      return DB.listar('ajustes', { eq: [['clave', clave]] }).then(function (l) { return l[0] ? l[0].valor : null; });
    };
    DB.guardarAjuste = function (clave, valor) {
      return DB.listar('ajustes', { eq: [['clave', clave]] }).then(function (l) {

<script>
/* Motor de pantallas: interpreta las plantillas (sc-for, sc-if, {{huecos}}) y los componentes. */
(function () {
  var APP = window.APP;

  var root = document.getElementById('app');
  var instancias = {};
  var actual = null;
  var pendiente = false;
  var conSesion = false;
  var guardados = {};   // nodos que sobreviven al redibujo (lienzos)
  APP.lienzos = {};

  function iniciarLienzo(c) {
    if (c._lz) return;

    var ctx = c.getContext('2d');

      vacio: true, modificado: false, pila: [], alCambiar: null };
    function fondo() { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height); }

    fondo();
    lz.limpiar = function () { fondo(); lz.vacio = true; lz.modificado = true; lz.pila = []; aviso(); };
    lz.reiniciar = function () { fondo(); lz.vacio = true; lz.modificado = false; lz.pila = []; };
    lz.deshacer = function () {
      var u = lz.pila.pop();

    };

    lz.blob = function () { return new Promise(function (ok) { c.toBlob(ok, 'image/png'); }); };
    lz.cargar = function (url) {
      return new Promise(function (ok) {
        if (!url) { ok(); return; }

        img.crossOrigin = 'anonymous';
        img.onload = function () { fondo(); ctx.drawImage(img, 0, 0, c.width, c.height); lz.vacio = false; lz.modificado = false; lz.pila = []; ok(); };
        img.onerror = function () { ok(); };

      });
    };

    function punto(e) {

  var HUECO = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

    if (nodo.nodeType === 3) { padre.appendChild(document.createTextNode(interpolar(nodo.nodeValue, ctx))); return; }

      } else {

  function instancia(nombre) {

    try { if (id) { ini = activo.selectionStart; fin = activo.selectionEnd; } } catch (e) {}
    var cajas = [].map.call(root.querySelectorAll('[data-scroll-id]'), function (x) { return [x.getAttribute('data-scroll-id'), x.scrollLeft, x.scrollTop]; });
    var vals;
    try { vals = ins.comp.renderVals(); } catch (e) { console.error(e); return; }
    root.querySelectorAll('[data-keep]').forEach(function (n) { guardados[actual + ':' + n.getAttribute('data-keep')] = n; });

    if (salir) {
      var msg = APP.db.demo ? '¿Salir y borrar los datos de demostración?' : '¿Cerrar sesión?';
      if (window.confirm(msg)) APP.db.salir().then(function () { instancias = {}; comprobarSesion(); });
    }
  });
  window.addEventListener('hashchange', ir);

  // ---------- Instalar la aplicación ----------
  var promptInstalar = null;
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function instalada() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }
  function marcarInstalable(si) {
    document.body.classList.toggle('puede-instalar', !!si && !instalada());
    var oculto = false;
    try { oculto = localStorage.getItem('fisio-aviso-instalar') === 'no'; } catch (e) {}
    document.body.classList.toggle('mostrar-aviso', !!si && !oculto);
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); promptInstalar = e; marcarInstalable(true);
  });
  window.addEventListener('appinstalled', function () {
    promptInstalar = null; marcarInstalable(false);
  });
  if (esIOS && !instalada()) marcarInstalable(true);

  var aviso = document.createElement('div');
  aviso.className = 'aviso-instalar';
  aviso.setAttribute('role', 'region');
  aviso.setAttribute('aria-label', 'Instalar la aplicación');
  aviso.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M12 7v7M9 11l3 3 3-3"></path></svg>'
    + '<p>Instala la app en este dispositivo.</p>'
    + '<button type="button" class="si" data-action="instalar">Instalar</button>'
    + '<button type="button" class="no" aria-label="Ocultar este aviso">×</button>';
  document.body.appendChild(aviso);
  aviso.querySelector('.no').addEventListener('click', function () {
    try { localStorage.setItem('fisio-aviso-instalar', 'no'); } catch (e) {}
    document.body.classList.remove('mostrar-aviso');
  });

  function pasosInstalar() {
    var capa = document.createElement('div');
    capa.style.cssText = 'position:fixed;inset:0;background:rgba(15,42,74,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;font-family:Nunito,system-ui,sans-serif;color:#0F2A4A';
    var pasos = esIOS
      ? '<li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.</li>'
      : '<li>Abre el menú del navegador (los tres puntos ⋮).</li><li>Elige <b>Instalar aplicación</b> o <b>Agregar a pantalla principal</b>.</li><li>Confirma con <b>Instalar</b>.</li>';
    capa.innerHTML = '<div role="dialog" aria-labelledby="t-inst" style="width:420px;max-width:100%;background:#fff;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px">'
      + '<h2 id="t-inst" style="margin:0;font-size:21px;font-weight:800">Instalar la app</h2>'
      + '<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45">' + pasos + '</ol>'
      + '<button type="button" style="align-self:flex-end;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:#1D4ED8;color:#fff;font:inherit;font-weight:800;cursor:pointer">Entendido</button></div>';
    document.body.appendChild(capa);
    var btn = capa.querySelector('button'); btn.focus();
    btn.addEventListener('click', function () { capa.remove(); });
    capa.addEventListener('click', function (e) { if (e.target === capa) capa.remove(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-action="instalar"]');
    if (!b) return;
    if (promptInstalar) {
      var p = promptInstalar; promptInstalar = null;
      p.prompt();
      p.userChoice.then(function (r) { if (r.outcome === 'accepted') marcarInstalable(false); }).catch(function () {});
    } else {
      pasosInstalar();
    }
  });

  if (APP.db.error) {
    root.innerHTML = '<p style="font-family:system-ui;padding:40px;color:#991B1B">' + APP.db.error + '</p>';
    return;
  }
  if (APP.db.demo) {
    var b = document.createElement('div');
    b.textContent = 'Modo demostración: datos ficticios guardados solo en este navegador. Configura Supabase en config.js para usar datos reales.';
    b.setAttribute('role', 'status');
    b.style.cssText = 'font-family:Nunito,system-ui,sans-serif;background:#FFF4C7;color:#713F12;font-size:14px;font-weight:700;padding:10px 20px;text-align:center';
    document.body.insertBefore(b, root);
    document.body.classList.add('demo');
  }
  // Supabase avisa de nuevo la sesión al volver a la pestaña o al renovar el token:
  // solo se reinicia la aplicación si de verdad se entró o se salió.
  APP.db.alCambiarSesion(function () {
    APP.db.usuario().then(function (u) {
      if (!!u !== conSesion) { instancias = {}; comprobarSesion(); }
    });
  });
  comprobarSesion();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
